name: M1racle Anki Kevin Cloze and review regression
on:
  push:
    paths:
      - m1racle-anki-lab/index.html
      - m1racle-anki-lab/tests/**
      - .github/workflows/test-anki-core-v33.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Generate a synthetic Kevin Image Cloze deck
        run: python3 m1racle-anki-lab/tests/generate_fixture.py
      - name: Serve actual static website files
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/anki-v33-server.log 2>&1 &
      - name: Run mobile-sized end-to-end regressions
        run: node m1racle-anki-lab/tests/smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1racle-anki-v33-regression-screenshots
          path: /tmp/anki-v33-*.png
          if-no-files-found: ignore
