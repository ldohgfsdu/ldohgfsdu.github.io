name: Vendor Anki browser libraries

on:
  push:
    paths:
      - .github/workflows/vendor-anki-libraries.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download pinned browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --ignore-scripts jszip@3.10.1 sql.js@1.13.0 fzstd@0.1.1 ts-fsrs@5.4.2 esbuild@0.25.0
          mkdir -p m1racle-anki-lab/vendor
          cp node_modules/jszip/dist/jszip.min.js m1racle-anki-lab/vendor/jszip.min.js
          cp node_modules/sql.js/dist/sql-wasm.js m1racle-anki-lab/vendor/sql-wasm.js
          cp node_modules/sql.js/dist/sql-wasm.wasm m1racle-anki-lab/vendor/sql-wasm.wasm
          cp node_modules/fzstd/umd/index.js m1racle-anki-lab/vendor/fzstd.js
          cat > .m1racle-fsrs-entry.js <<'EOF'
          import * as FSRS from 'ts-fsrs';
          window.M1racleFSRS = FSRS;
          EOF
          ./node_modules/.bin/esbuild .m1racle-fsrs-entry.js --bundle --minify --format=iife --platform=browser --outfile=m1racle-anki-lab/vendor/fsrs.js
          rm -f .m1racle-fsrs-entry.js
      - name: Commit browser libraries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add m1racle-anki-lab/vendor/
          if git diff --staged --quiet; then
            echo 'No vendor changes'
          else
            git commit -m 'Vendor Anki browser libraries locally'
            git push origin HEAD:main
          fi
