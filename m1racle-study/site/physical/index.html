/* M1racle Study v2.0 enhancement layer */
:root{--ring:#94cdbc}
.brand-name{font-size:18px;letter-spacing:-.04em;font-weight:790}.brand-mark{background:transparent;box-shadow:none}
.nav-count{margin-left:auto;font-size:12px;background:var(--accent);color:white;padding:0px 7px;border-radius:99px}
.breadcrumbs strong{color:var(--accent2);font-size:14px}
.eyebrow{letter-spacing:.125em}
.studio-strip{display:flex;align-items:stretch;gap:16px;margin-top:18px}
.studio-status{flex:1;border-radius:19px;padding:19px 22px;background:var(--layer);border:1px solid var(--edge);display:flex;align-items:center;gap:17px;text-align:left;color:var(--ink);cursor:pointer;box-shadow:var(--shadow);transition:transform .2s,border-color .2s}
.studio-status:hover{transform:translateY(-2px);border-color:var(--accent)}
.studio-status .ring{width:63px;height:63px;flex:0 0 auto;display:grid;place-items:center;border-radius:50%;background:conic-gradient(var(--accent) var(--progress),var(--edge) 0);position:relative}
.studio-status .ring:before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--layer)}
.studio-status .ring strong{z-index:1;font-size:14px}
.studio-status h3{margin:1px 0 5px;font-size:14px}.studio-status p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}
.studio-status .detail{margin-left:auto;color:var(--accent2);font-weight:800}
.kicker{font-size:12px;letter-spacing:.15em;color:var(--accent2);font-weight:850;text-transform:uppercase}
.page-dashboard{margin-top:18px}.review-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.review-count{font-size:28px;font-weight:900;line-height:1.2;letter-spacing:-.045em}
.review-panel{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px}
.review-prompt{padding:25px;border-radius:18px;background:var(--layer2);margin:18px 0;min-height:145px}

:86,"pageEnd":86},"9":{"steps":[{"action":"暴露上臂内侧或手背，轻提皮肤再放开，观察复原速度","say":"下面检查皮肤弹性。"},{"action":"检查小腿内侧等部位有无肿胀，指腹适当按压后观察是否留下凹陷","say":"下面检查下肢是否存在凹陷性水肿。"},{"action":"双侧比较，记录部位、范围及表现","say":"我记录皮肤弹性和水肿情况。"}],"result":"皮肤弹性：____；双下肢水肿：____。","pageStart":86,"pageEnd":86},"10":{"steps":[{"action":"观察上腔静脉回流区域有无典型蜘蛛痣形态","say":"我检查皮肤有无蜘蛛痣。"},{"action":"用指腹或透明片轻压中央，观察周围细小血管颜色变化","say":"我轻压皮损中央，观察褪色和恢复情况。"},{"action":"检查有无皮肤出血点，并按大小分类；不凭肉眼色斑直接做诊断","say":"我记录皮损形态和直径，区分瘀点、紫癜与瘀斑。"}],"result":"蜘蛛痣：____；出血点大小及分布：____。","pageStart":86,"pageEnd":86},"11":{"steps":[{"action":"患者头颈放松，以三指指腹轻柔依次触诊耳前、耳后、枕后、颏下、颌下、颈前、颈后、锁骨上淋巴结","say":"请低头放松，我依次检查颈部浅表淋巴结。"},{"action":"在腋窝分别检查腋尖、内侧、前群、后群与外侧淋巴结","say":"请稍抬起手臂并放松，我检查腋窝淋巴结。"},{"action":"在腹股沟检查水平组和垂直组；描述大小、质地、压痛及活动度","say":"现在检查腹股沟淋巴结，并记录触诊结果。"}],"result":"淋巴结：部位____；大小____；压痛____；活动度____。","pageStart":86,"pageEnd":86},"12":{"steps":[{"action":"患者坐位，充分照明，按照自上而下顺序观察眼睑、睫毛、眼裂","say":"请看向正前方，我先观察双眼外观。"},{"action":"按从外到内的顺序检查眼睑结膜、巩膜及瞳孔等可见结构","say":"请配合睁眼、闭眼，我观察眼部各结构。"},{"action":"双眼对比，描述对称情况与异常外观","say":"眼部视诊完成。"}],"result":"眼外观：____；双侧对称情况：____。","pageStart":86,"pageEnd":87},"13":{"steps":[{"action":"检查者手指置于患者前方约30～40cm，嘱患者头不动、眼随指动","say":"请保持头部不动，只用眼睛跟随我的手指。"},{"action":"缓慢引导视线上、下、左、右及斜向移动，避免动作过快","say":"请看向这里，再看向这一侧。"},{"action":"观察双眼协同运动以及是否有限制或眼震","say":"眼球运动检查完成。"}],"result":"眼球各方向运动：____；眼震：____。","pageStart":87,"pageEnd":87},"14":{"steps":[{"action":"在正常照明下观察双侧瞳孔大小、形状及对称性","say":"我现在观察您的瞳孔大小和形状。"},{"action":"比对两侧，必要时使用合适量尺估计直径；避免强光长时间照射","say":"请保持注视前方，我比较左右瞳孔。"},{"action":"记录直径与是否等大等圆，不将教材常值直接当作受检者结果","say":"我记录双侧瞳孔的实际表现。"}],"result":"双瞳孔直径：左____mm、右____mm；形态：____。","pageStart":87,"pageEnd":87},"15":{"steps":[{"action":"适当降低环境光，嘱患者注视远处","say":"请看向远处，不要追视手电光。"},{"action":"手电由侧方照射一侧眼睛，观察照射侧瞳孔变化","say":"我先观察直接对光反射。"},{"action":"保持照射，观察未照射侧瞳孔变化，再换另一侧重复","say":"下面观察间接对光反射，并作双侧比较。"}],"result":"直接对光反射：____；间接对光反射：____。","pageStart":87,"pageEnd":87},"16":{"steps":[{"action":"受检者张口，检查者使用手电或压舌板，注意避免恶心刺激","say":"请张大嘴，发“啊”的声音。"},{"action":"按照软腭、悬雍垂、腭弓、扁桃体和咽后壁顺序观察","say":"我依次观察软腭、悬雍垂、腭弓及扁桃体。"},{"action":"描述有无肿大、充血、渗出物等实际所见","say":"扁桃体及咽部检查完成。"}],"result":"扁桃体及咽部：____。","pageStart":87,"pageEnd":87},"17":{"steps":[{"action":"患者颈部自然放松，观察甲状腺区域及吞咽时活动","say":"请颈部稍微放松，稍后我会请您做吞咽动作。"},{"action":"确定胸骨上切迹与甲状软骨位置，先触查峡部","say":"我先检查甲状腺峡部。"},{"action":"采用“推、钩、摸、吞咽”的要领分别触查左右侧叶","say":"请吞咽一下，我检查一侧侧叶，然后检查另一侧。"},{"action":"记录有无增大、结节、压痛或随吞咽移动","say":"甲状腺检查结束。"}],"result":"甲状腺大小：____；结节：____；压痛：____。","pageStart":87,"pageEnd":87},"18":{"steps":[{"action":"患者坐位或半卧位，颈部轻度放松，观察颈静脉状态及异常搏动","say":"我先观察颈部静脉及动脉外观。"},{"action":"必要时轻柔定位颈动脉搏动，注意不可双侧同时用力压迫","say":"我再检查颈动脉搏动情况。"},{"action":"按检查要求在适当区域听诊有无血管杂音","say":"最后听诊颈部血管。"}],"result":"颈静脉：____；颈动脉搏动及杂音：____。","pageStart":87,"pageEnd":87},"19":{"steps":[{"action":"受检者取坐位，暴露胸部体表标志","say":"我要先确认胸部解剖标志，请配合体位。"},{"action":"在体表按教材顺序指认4窝、3角和4区的位置","say":"我依次指出胸部的窝、角、区。"},{"action":"指出9条纵线并口述定位原则，避免只指而不解释","say":"我再指出9条体表线，用于后续叩诊定位。"}],"result":"已完成胸部4窝、3角、4区及9线定位。","pageStart":87,"pageEnd":87},"20":{"steps":[{"action":"患者坐位，双肩自然放松，从正面观察胸廓","say":"我观察胸廓外形及左右是否对称。"},{"action":"从侧面观察前后径及横径关系，有无异常隆起或凹陷","say":"我进一步观察胸廓前后径与横径。"},{"action":"结合实际所见记录异常形态或对称性","say":"胸廓视诊结束。"}],"result":"胸廓形态：____；对称性：____。","pageStart":87,"pageEnd":87},"21":{"steps":[{"action":"在适当暴露和隐私保护下观察双侧胸壁皮肤","say":"我检查胸壁皮肤颜色及完整性。"},{"action":"观察有无皮疹、瘢痕、蜘蛛痣和浅表静脉曲张","say":"我重点观察胸壁皮肤及血管变化。"},{"action":"左右比较并记录部位及性质","say":"胸壁视诊结束。"}],"result":"胸壁皮肤：____；浅表血管：____。","pageStart":87,"pageEnd":87},"22":{"steps":[{"action":"患者坐位、自然呼吸，正面及侧面观察胸腹部呼吸运动","say":"请保持自然呼吸。"},{"action":"计数1分钟，同时看呼吸运动是否对称、是否费力","say":"我计数呼吸频率，并观察节律和幅度。"},{"action":"如需深呼吸检查，先解释后再让患者配合","say":"接下来请深吸气、呼气，我比较双侧胸廓活动。"}],"result":"呼吸频率：____ 次/分；胸廓运动：____。","pageStart":87,"pageEnd":87},"23":{"steps":[{"action":"双手对称放在患者胸壁对应部位，检查胸廓扩张情况","say":"请深吸气，我比较两侧胸廓活动。"},{"action":"双手按对称部位贴于胸壁，请患者重复低声发音以比较语音震颤","say":"请重复说“一、二、三”，我检查语音震颤。"},{"action":"改用听诊器检查双侧相应部位的语音共振，注意与触诊概念区分","say":"请继续重复发音，我用听诊器听语音共振。"}],"result":"胸廓扩张度：____；语音震颤：____；语音共振：____。","pageStart":87,"pageEnd":87},"24":{"steps":[{"action":"患者端坐、颈部稍前屈，暴露双肩上方","say":"我现在叩诊肺上界。"},{"action":"从斜方肌中点开始，沿肺尖方向向外叩诊，标记清音转变位置","say":"我先寻找一侧肺上界的外侧界。"},{"action":"再向内叩诊确定内侧界，记录两点间宽度，另一侧同法","say":"我确定内侧界并测量宽度，左右比较。"}],"result":"肺上界宽度：左____cm、右____cm。","pageStart":87,"pageEnd":88},"25":{"steps":[{"action":"先通过胸骨角、肋间、肩胛下角等解剖标志定位","say":"我先确定肺下界的体表定位。"},{"action":"沿右锁骨中线由上向下逐肋间叩诊，标记清音转浊音位置","say":"我在右锁骨中线上定位肺下界。"},{"action":"继续沿腋中线及肩胛线相应位置叩诊，必要时双侧比较","say":"我再检查腋中线和肩胛线附近肺下界。"}],"result":"肺下界：各定位线叩诊结果____。","pageStart":88,"pageEnd":88},"26":{"steps":[{"action":"在肩胛线选择肺下界叩诊位置，患者平静呼吸，标记基准","say":"我先定位平静呼吸时的肺下界。"},{"action":"嘱患者深吸气并屏气，向下叩诊，标记清音转浊音界","say":"请深吸气后屏住，我标记吸气时位置。"},{"action":"嘱患者充分呼气并屏气，重新叩诊并标记，测量两点距离","say":"请缓慢呼尽气后屏住，我测量肺下界移动距离。"}],"result":"肺下界移动度：左____cm、右____cm。","pageStart":88,"pageEnd":88},"27":{"steps":[{"action":"征得同意并保护隐私，按要求暴露检查部位","say":"现在观察乳房外形，我会注意遮盖。"},{"action":"正面观察两侧大小、外形和对称性","say":"我检查双侧乳房的对称情况。"},{"action":"观察皮肤、乳晕及乳头有无凹陷、红肿等变化","say":"我观察皮肤和乳头有无异常。"}],"result":"双侧乳房外观：____；皮肤及乳头：____。","pageStart":88,"pageEnd":88},"28":{"steps":[{"action":"告知会触及乳房并取得同意，患者按检查要求采取合适体位","say":"下面需要触诊乳房，如有不适请告诉我。"},{"action":"以指腹轻柔系统触查乳房各象限，教材提示左侧顺时针、右侧逆时针","say":"我按照固定顺序触诊左侧，再检查右侧。"},{"action":"最后检查乳头、乳晕，并根据检查要求判断是否存在分泌物","say":"最后检查乳头区域，双侧比较。"}],"result":"乳房触诊：____；乳头情况：____。","pageStart":88,"pageEnd":88},"29":{"steps":[{"action":"受检者仰卧，胸部适当暴露，检查者从不同角度观察","say":"我先从侧方观察心前区外形及异常搏动。"},{"action":"改变观察视角，定位心尖搏动位置和范围","say":"我再观察心尖搏动的位置与范围。"},{"action":"汇报有无隆起及实际观察到的心尖搏动","say":"心脏视诊完成。"}],"result":"心前区外观：____；心尖搏动位置：____。","pageStart":88,"pageEnd":88},"30":{"steps":[{"action":"患者仰卧或按要求体位，先以掌面轻触心尖搏动区域","say":"我先触诊心尖搏动的位置与范围。"},{"action":"按二尖瓣、肺动脉瓣、主动脉瓣、主动脉瓣第二听诊区和三尖瓣区检查有无震颤","say":"我依次检查五个瓣膜区。"},{"action":"最后用掌面在适当区域检查心包摩擦感","say":"最后检查有无心包摩擦感。"}],"result":"心尖搏动触诊：____；震颤：____；摩擦感：____。","pageStart":88,"pageEnd":88},"31":{"steps":[{"action":"受检者仰卧，确定心尖搏动、肋间和胸骨旁位置","say":"我先定位心脏相对浊音界。"},{"action":"先叩左界，自下向上、由外向内轻叩，标记清音变浊音处","say":"我先叩诊心脏左界。"},{"action":"再叩右界，逐肋间同法标记，按教材要求连线表示浊音界","say":"我再 ent}%</h1><p>${q.correct} / ${q.questions.length} 题答对</p><div class="bar" style="margin:20px 0"><i style="width:${percent}%"></i></div><div class="hero-cta" style="justify-content:center"><button class="btn" data-quiz="new">重新组卷</button><button class="btn secondary" data-quiz="wrong">错题再练</button></div></div>${wrong.length?`<section class="section"><div class="section-head"><h2>本轮错题回看</h2></div><div class="panel">${wrong.map(x=>`<div class="help-row"><span class="help-icon">${x.item}</span><div><b>${esc(item(x.item).title)}</b><div class="small muted">${esc(DATA.quiz.find(y=>y.item===x.item)?.why||'')}</div><div style="margin-top:5px">${pageBtn(item(x.item).pageStart)} <button class="btn sm soft" data-openitem="${x.item}">回到考点</button></div></div></div>`).join('')}</div></section>`:''}</div>`}let cur=q.questions[q.index];let checked=q.selected!==null;return hdr('自测闯关','答题后显示正确选项与出处；支持根据错误考点继续复习。')+`<div class="quiz-shell"><div class="panel"><div class="quiz-progress"><span>第 ${q.index+1} / ${q.questions.length} 题</span><span>已答对 ${q.correct} 题</span></div><div class="bar"><i style="width:${pct(q.index+1,q.questions.length)}%"></i></div><div style="margin-top:20px"><span class="group-tag">考点 #${String(cur.item).padStart(2,'0')}，${esc(cat(item(cur.item).cat).name)}</span> <span class="micro">书内P${item(cur.item).pageStart}</span></div><h2 class="quiz-q">${esc(cur.q)}</h2><div class="choices">${cur.options.map((o,i)=>`<button class="choice ${checked?(i===cur.answer?'correct':i===q.selected?'incorrect':''):''}" data-answer="${i}" ${checked?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span>${checked&&i===cur.answer?'<span style="margin-left:auto">✓</span>':''}</button>`).join('')}</div>${checked?`<div class="explain"><div class="answer-badge">${q.selected===cur.answer?'回答正确':'本题未答对'}，标准答案：${String.fromCharCode(65+cur.answer)}</div><p>${esc(cur.why)}</p><div style="margin-top:12px">${pageBtn(item(cur.item).pageStart)} <button class="btn sm soft" data-openitem="${cur.item}">复习这一考点</button></div></div><div class="toolbar" style="justify-content:flex-end"><button class="btn" data-quiz="next">${q.index===q.questions.length-1?'查看成绩':'下一题 →'}</button></div>`:`<p class="micro">请选择一个答案，提交后可查看解释与来源。</p>`}</div></div>`}
function renderNotes(){let it=item(ui.noteId);let notesCount=Object.values(saved.notes).filter(x=>String(x).trim()).length;return hdr('我的笔记','每个考点有独立笔记，可导出JSON或Markdown。资料、测验记录和进度均只存于当前浏览器，无云端同步。')+`<div class="grid2"><section class="panel"><div class="toolbar"><div><div class="eyebrow">PERSONAL NOTES</div><h2 style="margin:7px 0">考点复习笔记</h2></div><span class="group-tag">已写 ${notesCount} 项</span></div><label class="caption" for="note-pick">选择考点</label><select class="picker" id="note-pick" style="margin:7px 0 15px">${DATA.items.map(x=>`<option value="${x.id}" ${ui.noteId===x.id?'selected':''}>${String(x.id).padStart(2,'0')}，${esc(x.title)} ${saved.notes[x.id]?'✎':''}</option>`).join('')}</select><p class="small muted">${esc(it.core)}</p>${pageBtn(it.pageStart)}<textarea id="item-note" placeholder="记录：检查体位 / 双侧操作 / 手法细节 / 易错点 / 结果汇报…" style="margin:15px 0 10px">${esc(saved.notes[ui.noteId]||'')}</textarea><div class="toolbar"><span class="micro">建议每学完一个动作就补一行</span><button class="btn" data-act="save-note">保存考点笔记</button></div></section><section class="panel"><div class="eyebrow">EXAM REVIEW</div><h2 style="margin:8px 0">我的考前总复盘</h2><p class="small muted">将最容易漏掉的固定动作统一写在这里。</p><textarea id="global-note" placeholder="例如：① 用语要简洁；② 左右侧对比；③ 完成后报告检查结果…">${esc(saved.globalNote||'')}</textarea><div class="toolbar" style="margin-top:10px"><span class="micro">仅保存于浏览器本地</span><button class="btn" data-act="save-global">保存总笔记</button></div><div class="panel-lite" style="margin-top:20px"><h3 style="margin:0 0 10px">备份与迁移</h3><p class="small muted">单文件HTML可直接离线打开。不同浏览器/不同设备的进度不会自动互通，建议及时导出JSON备份。</p><div class="toolbar"><div class="left"><button class="btn sm soft" data-act="export-json">导出JSON</button><button class="btn sm secondary" data-act="export-md">导出Markdown</button></div><button class="btn sm ghost" data-act="import-json">导入JSON</button></div></div></section></div><section class="section"><div class="panel"><div class="section-head"><div><h2>有内容的笔记</h2><p>点击任意条目回到编辑器</p></div></div>${Object.keys(saved.notes).filter(k=>saved.notes[k]&&saved.notes[k].trim()&&item(+k)).length?`<div class="grid2">${Object.keys(saved.notes).filter(k=>saved.notes[k]?.trim()&&item(+k)).sort((a,b)=>+a-+b).map(k=>`<button class="map-node" data-noteto="${k}"><div style="min-width:0"><b>#${k}，${esc(item(+k).title)}</b><br/><span>${esc(saved.notes[k]).slice(0,88)}</span></div><span>↗</span></button>`).join('')}</div>`:`<div class="empty">暂无个人考点笔记。先选择一个考点写下易错动作。</div>`}</div></section>`}
function renderSources(){let captions={84:'物品准备、礼貌用语和操作规范',85:'无菌与爱伤、通用注意事项、一般检查起始',86:'一般检查1—11，眼部视诊12起始',87:'头颈部12—18，胸部19—24起始',88:'胸部24—33与心脏检查',89:'胸部34，腹部35—45起始',90:'腹部45—51，脊柱和手部52—54起始',91:'四肢54—58，神经反射59—60起始',92:'神经反射60—66及病理征表格'};return hdr('来源与原页','公开版仅提供原书页码定位，不附教材扫描图片。所有考点以书内页码、PDF物理页码双重定位；点击页码卡片查看来源定位。')+`<div class="callout" style="margin-bottom:20px"><b>来源等级说明：</b>“教材提炼”栏目据用户上传的原书页码定位转述；“特别注意”优先保留原书提醒，如有学习性整理则显式说明。自测题是基于原文编写的练习，不是教材原有试题。本站没有联网验证医学最新指南，也不替代正式技能操作示教。</div><div class="grid3">${Object.keys(captions).map(p=>`<button class="source-tile" data-page="${p}"><img src="${SOURCE_IMAGES[p]}" alt="书内第${p}页缩略图" loading="lazy"/><div class="pad"><h4>书内 P${p}，PDF 第${+p+7}页</h4><p>${esc(captions[p])}</p></div></button>`).join('')}</div><section class="section"><div class="panel"><div class="section-head"><div><h2>跨页考点对照</h2><p>连续两页都有内容时双页标注，避免截断来源</p></div></div><div class="table-wrap"><table><thead><tr><th>考点编号</th><th>标题</th><th>书内页码</th><th>PDF页码</th></tr></thead><tbody>${DATA.items.filter(x=>x.pageStart!==x.pageEnd).map(x=>`<tr><td>#${x.id}</td><td>${esc(x.title)}</td><td>P${x.pageStart}–${x.pageEnd}</td><td>${x.pdfStart}–${x.pdfEnd}</td></tr>`).join('')}</tbody></table></div></div></section><section class="section"><div class="panel"><div class="eyebrow">INSPIRED BY</div><h2 style="margin:7px 0">关于本学习网页</h2><p class="small muted">学习体验借鉴开源项目 <a href="https://github.com/dmoshehun-prog/learn-from-materials" target="_blank" rel="noopener" style="color:var(--accent2);text-decoration:underline">learn-from-materials</a> 中“来源可追溯、交互式导学、框架地图、自测与本地笔记”的设计理念。本站为独立实现的单文件离线网页，并非该仓库的官方构建物；未加载任何外部依赖。</p></div></section>`}

function drillRecord(id){return DRILLS[String(id)]}
function ticked(id,i){return !!(saved.drillChecks?.[id]?.[i])}
function drillSteps(id,compact=false){const r=drillRecord(id);if(!r)return '<p>尚无操作数据。</p>';return `<div class="drill-track">${r.steps.map((s,i)=>`<div class="drill-step ${ticked(id,i)?'done':''}"><label class="drill-check"><input type="checkbox" data-drill-check="${id}" data-step="${i}" ${ticked(id,i)?'checked':''} aria-label="完成第${i+1}步"/><span>${i+1}</span></label><div class="drill-copy"><div class="drill-label">动作 ${i+1}</div><p>${esc(s.action)}</p>${!ui.scriptHide?`<div class="spoken-line"><span>口述</span>“${esc(s.say)}” <button class="say-btn" data-say="${id}" data-saystep="${i}" title="朗读这一句示范口述">朗读 ▷</button></div>`:'<span class="micro">已隐藏口述，先自己复述动作。</span>'}</div></div>`).join('')}</div>`}
function drillIntro(id){const x=item(id);return `您好，我现在给您做${x.title}检查。过程中如有不适，请及时告诉我。`}
function drillResult(id){return `报告老师，${item(id).title}检查已完成。${drillRecord(id).result} 以上空格按实际测量和观察填写。`}
function drillPanel(id){const r=drillRecord(id);const n=r.steps.length,done=r.steps.filter((_,i)=>ticked(id,i)).length;return `<div class="drill-panel"><div class="drill-keyline"><div><span class="tag source-tag">教材：书内 P${r.pageStart}${r.pageEnd!==r.pageStart?'–'+r.pageEnd:''}，PDF ${r.pageStart+7}${r.pageEnd!==r.pageStart?'–'+(r.pageEnd+7):''}</span><span class="tag generated-tag">练习示范（非教材逐字台词）</span></div><div class="drill-count">${done}/${n} 步</div></div><div class="spoken-intro"><b>先对患者说</b><p>“${esc(drillIntro(id))}”</p><button class="say-btn" data-say="${id}" data-saystep="intro">朗读 ▷</button></div>${drillSteps(id)}<div class="spoken-intro result"><b>向考官汇报，填空模板</b><p>${esc(drillResult(id))}</p><button class="say-btn" data-say="${id}" data-saystep="result">朗读 ▷</button></div><div class="drill-actions"><button class="btn sm secondary" data-drill-reset="${id}">重练本项</button><button class="btn sm" data-script-go="${id}">进入逐项跟练</button></div><p class="drill-disclaimer">教材仅提供操作要点与部分示例开、结束语。这里的患者沟通、动作拆解和结果填空属于学习示范，不等同于原书逐字内容；实际操作及评分以当前考试要求和规范示教为准。</p></div>`}

有无回缩（2分）、发红（2分）、溃疡（2分）、橘皮样外观（2分），静脉显露情况（2分），乳头位置（2分）、是否对称（2分）、有无内陷（2分）、有无分泌物（2分），各淋巴结区域皮肤是否有发红（1分）、溃疡（1分）、瘘管（1分）、窦道（1分）","max":26,"id":7},{"group":"乳腺触诊","text":"检查手法：触摸时手掌平伸（2分）、四指并拢（2分），用手指掌面触诊（2分），用力不宜过大（2分）","max":8,"id":8},{"group":"乳腺触诊","text":"检查顺序：乳房的外上（2分）,外下（2分），内下（2分），内上（2分）区域最后是乳头及乳晕区（2分）","max":10,"id":9},{"group":"乳腺触诊","text":"检查细节：测量肿块大小（可手指法估计）（2分）；质地（2分）；边界是否清楚（2分）；表面状况（2分）；活动度（2分）；皮肤与肿块是否有粘连（2分）；挤压肿块检查乳头是否有溢液（2分）；肿块有无压痛（2分）","max":16,"id":10},{"group":"乳腺触诊","text":"手指挤压乳头，检查是否有溢液","max":2,"id":11},{"group":"淋巴结触诊","text":"检查手法：滑动触诊","max":2,"id":12},{"group":"淋巴结触诊","text":"检查方式：右手检查左腋窝（2分），左手检查右腋窝（2分）","max":4,"id":13},{"group":"淋巴结触诊","text":"腋窝淋巴结检查顺序：顶（2分）、前（2分）、内（2分）、后（2分）、外（2分）","max":10,"id":14},{"group":"淋巴结触诊","text":"最后检查锁骨上及锁骨下淋巴结（2分）","max":2,"id":15},{"group":"注意事项","text":"检查时前搓热双手，动作轻柔、态度亲切，关注病人的感受","max":5,"id":16},{"group":"注意事项","text":"操作后恢复患者衣物及被褥整齐","max":2,"id":17},{"group":"注意事项","text":"最后向患者交代检查后得到的初步诊断方向及相应处理","max":3,"id":18}],"sum":100,"note":""},{"id":4,"name":"肺部","section":"02-4","rows":[{"group":"准备","text":"医师准备：穿工作服，戴口罩、帽子，洗手（可口述）","max":2,"id":1},{"group":"准备","text":"操作前告知患者检查内容及目的，取得患者同意","max":2,"id":2},{"group":"准备","text":"评估环境，保护患者隐私","max":1,"id":3},{"group":"准备","text":"男性选手需口述要求女性医务人员陪同（女性选手直接得分）","max":2,"id":4},{"group":"准备","text":"完全暴露患者检查部位，注意保暖","max":1,"id":5},{"group":"准备","text":"体位：坐位或者卧位（医者立于患者右侧）","max":2,"id":6},{"group":"前侧胸部检查","text":"呼吸运动：胸/腹式呼吸（1分），有无三凹征，有无呼吸困难（2分）；","max":3,"id":7},{"group":"前侧胸部检查","text":"呼吸频率  次/分（1分）；（口述未见浅快及深大呼吸，1分）","max":2,"id":8},{"group":"前侧胸部检查","text":"呼吸节律均匀整齐（1分），无潮式呼吸，无间停呼吸，无叹气样呼吸及抑制性呼吸（每项0.5分）。","max":3,"id":9},{"group":"前侧胸部检查","text":"胸廓扩张度手法正确（3分），报告结果前胸胸廓扩张度双侧对称（1分）；","max":4,"id":10},{"group":"前侧胸部检查","text":"语音震颤（位置正确2分，手法正确2分），报告结果（1分）；","max":5,"id":11},{"group":"前侧胸部检查","text":"胸膜摩擦感：胸廓下前侧部，吸气、呼气（2）（口述：触诊到胸膜摩擦感时需屏住呼吸，1分），报告结果（1分）。（备注：也可在背部触诊时触诊）","max":4,"id":12},{"group":"前侧胸部检查","text":"从锁骨上窝开始，然后从第一肋间，沿锁骨中线和腋前线逐一向下叩诊；后查侧胸，嘱患者举起上臂置于头部，用腋窝开始，沿腋中线和腋后线逐渐下叩；至到肺下界。（8分）报告结果：双肺叩诊清音。（2分）","max":10,"id":13},{"group":"前侧胸部检查","text":"叩诊锁骨中线和腋前线肺下界的位置。（每侧2分）","max":4,"id":14},{"group":"前侧胸部检查","text":"从肺尖开始，然后从第一肋间，沿锁骨中线和腋前线逐一向下听诊；后查侧胸，嘱患者举起上臂置于头部，从腋窝开始，沿腋中线和腋后线逐渐下听；至肺下界。每处听诊1-2个呼吸周期（7分）。报告结果（1分）。","max":8,"id":15},{"group":"前侧胸部检查","text":"语音共振（位置正确1分，手法正确2分），报告结果（1分）。","max":4,"id":16},{"group":"前侧胸部检查","text":"胸膜摩擦音：胸廓下前侧部，吸气、呼气（2分）（口述：听到胸膜摩擦音需屏住呼吸，报告结果，1分）。","max":3,"id":17},{"group":"背部检查","text":"胸廓是否对称，饱满（1分），呼吸运动是否对称（1分）；","max":2,"id":18},{"group":"背部检查","text":"胸廓扩张度（2分），报告结果（1分）；","max":3,"id":19},{"group":"背部检查","text":"语音震颤（位置正确1分，手法正确2分），报告结果","max":3,"id":20},{"group":"背部检查","text":"向前稍低头，双手交叉抱肘，尽可能使肩甲骨移向外侧，上半身略向前倾（1分），叩诊肺尖，报告肺尖宽度结果（3分）。（备注：亦可在前胸叩诊时叩诊）","max":4,"id":21},{"group":"背部检查","text":"对比叩诊，报告结果；（肩胛间区和肩胛下区各2分）","max":4,"id":22},{"group":"背部检查","text":"叩肩胛线肺下界，报告结果（2分）；叩诊肺下界肩甲线移动度，报告结果（6分）。","max":8,"id":23},{"group":"背部检查","text":"对比听诊，肩甲间区，肩甲下区；报告结果。","max":4,"id":24},{"group":"背部检查","text":"语音共振，报告结果。","max":2,"id":25},{"group":"注意事项","text":"操作轻柔、注意患者感受","max":2,"id":26},{"group":"注意事项","text":"操作过程中无过多改变患者体位，造成过多不适","max":3,"id":27},{"group":"注意事项","text":"操作完毕后复原患者衣物、被褥","max":3,"id":28},{"group":"注意事项","text":"告知患者检查结果","max":2,"id":29}],"sum":100,"note":""},{"id":5,"name":"心脏","section":"02-5","rows":[{"group":"准备","text":"医师准备：穿工作服，戴口罩、帽子，洗手（可口述）","max":2,"id":1},{"group":"准备","text":"操作前告知患者检查内容及目的，取得患者同意","max":2,"id":2},{"group":"准备","text":"评估环境，保护患者隐私","max":1,"id":3},{"group":"准备","text":"男性选手需口述要求女性医务人员陪同（女性选手直接得分）","max":2,"id":4},{"group":"准备","text":"完全暴露患者检查部位，注意保暖","max":1,"id":5},{"group":"准备","text":"体位：坐位或者卧位（医者立于患者右侧）","max":2,"id":6},{"group":"视诊","text":"患者取卧位，医师视线与胸廓同高。","max":1,"id":7},{"group":"视诊","text":"观察有无心前区隆起，报告结果：心前区无异常隆起，无鸡胸、漏斗胸，脊柱畸形。","max":3,"id":8},{"group":"视诊","text":"观察心尖搏动：心尖搏动位于第5肋间左锁骨中线内1cm处，搏动范围直径约2cm。未见增强及减弱。未见负性心尖搏动。","max":3,"id":9},{"group":"视诊","text":"观察心前区搏动：胸骨左缘3,4肋间、剑突下、心底部未见心脏搏动。","max":3,"id":10},{"group":"触诊","text":"使用右手掌，后使用小鱼际，最后使用中指和食指指腹触诊心尖搏动，报告结果，心尖搏动位于第5肋间左锁骨中线内1cm处，搏动范围直径约2cm。未及增强及减弱。","max":5,"id":11},{"group":"触诊","text":"触诊震颤：分别在心尖区、肺动脉瓣区（胸骨左缘第2肋间）、胸骨右缘第2肋间（主动脉瓣区）、胸骨左缘第3肋间（主动脉瓣第二听诊区）、胸骨左缘第3-4肋间（触诊到收缩期震颤提示室间隔缺损）、胸骨左缘,4，5肋间（三尖瓣区）触诊，报告结果未触及震颤。","max":10,"id":12},{"group":"触诊","text":"触诊心包摩擦感：在心前区及胸骨左缘第3,4肋间触诊，报告结果，未触及心包摩擦感，口述若触到摩擦感后需嘱患者屏住呼吸，与胸膜摩擦感鉴别。","max":5,"id":13},{"group":"叩诊","text":"顺序：先左后右，从下到上，从外到内（3分）。右侧先叩出肝上界，在肝上界的上一肋间进行叩诊（3分）。 标注、测量标注点与前正中线的距离；测量锁骨中线与前正中线的距离。记录结果（7条线，每条线2分）。","max":20,"id":14},{"group":"听诊","text":"考生在被检查者身体上指出5个听诊区的名称、位置。听诊内容：心率（可与脉率相比较）、心律（是否齐整、有无早搏）、心音（注意强弱），有无杂音、额外心音、心包摩擦音（6分） 听诊演示顺序：从二尖瓣区开始――肺动脉瓣区――主动脉瓣区――主动脉第二听诊区――三尖瓣瓣区。逆时针方向(2分) 要求先用膜型听件，后用钟型听件（2分）","max":30,"id":15},{"group":"注意事项","text":"操作轻柔、注意患者感受","max":2,"id":16},{"group":"注意事项","text":"操作过程中无过多改变患者体位，造成过多不适","max":3,"id":17},{"group":"注意事项","text":"操作完毕后复原患者衣物、被褥","max":3,"id":18},{"group":"注意事项","text":"告知患者检查结果","max":2,"id":19}],"sum":100,"note":""},{"id":6,"name":"腹部","section":"02-6","rows":[{"group":"准备","text":"医师准备：穿工作服，戴口罩、帽子，洗手（可口述）","max":1,"id":1},{"group":"准备","text":"操作前告知患者检查内容及目的，取得患者同意","max":3,"id":2},{"group":"准备","text":"评估环境，注意保护患者隐私及保暖","max":1,"id":3},{"group":"准备","text":"物品准备：听诊器、手表、记号笔、尺子","max":1,"id":4},{"group":"准备","text":"体位：卧位，双下肢屈曲稍分开，充分暴露腹部（2分），检查者立于患者右侧（2分）","max":4,"id":5},{"group":"视诊","text":"腹部外形、呼吸运动、腹壁静脉、胃肠型、蠕动波、色素沉着、腹纹、瘢痕、疝、脐（每项0.5分）","max":5,"id":6},{"group":"听诊","text":"肠鸣音：于右下腹部听诊1分钟（口述）","max":2,"id":7},{"group":"听诊","text":"血管杂音：主动脉（2）、双侧肾动脉（2）、双侧髂动脉（2）","max":6,"id":8},{"group":"叩诊","text":"全腹叩诊：从左下逆时针至右下再至脐，呈G字型","max":3,"id":9},{"group":"叩诊","text":"肝浊音界：在右锁骨中线，从上向下叩上缘，从下向上叩下缘（4分）；脾脏上下界叩诊（2分）","max":6,"id":10},{"group":"叩诊","text":"肝、胆囊叩击痛","max":2,"id":11},{"group":"叩诊","text":"移动性浊音：自腹中部脐水平开始向患者左侧叩诊，发现浊音时，扳指固定不动，嘱患者右侧卧位，再度叩诊，如呈鼓音表明浊音移动。同法向右侧叩诊，叩得浊音后嘱患者左侧卧位，以核实浊音是否移动","max":7,"id":12},{"group":"叩诊","text":"膀胱叩诊：正中线上，由脐部叩至耻骨联合","max":4,"id":13},{"group":"叩诊","text":"肾区叩痛，注意双侧对比（可于最后坐起时叩诊）","max":2,"id":14},{"group":"触诊","text":"教患者腹式呼吸（1分），并将手置于患者腹部使其适应（1分）","max":2,"id":15},{"group":"触诊","text":"全腹浅部触诊：腹壁紧张度（1）、浅部病变（1）、压痛（1）、反跳痛（1）。应该从左下腹开始触诊，最后触诊右下腹（5），右下腹非最后触诊者不得分。","max":9,"id":16},{"group":"触诊","text":"全腹深部触诊：深部包块（1分）、压痛（1分）","max":2,"id":17},{"group":"触诊","text":"特殊压痛点检查：季肋点、上输尿管点、中输尿管点、肋脊点、肋腰点，麦氏点","max":6,"id":18},{"group":"触诊","text":"1、肝脏单手触诊：（单手和双手可任选一种）于右侧锁骨中线脐水平以下开始（1分），四指并拢、约与肋缘平行（1分），以指腹向上推动（1分），吸气时上抬指腹但不离开腹壁（1分），呼气时向下压腹壁（1分）；同样操作进行正中线的肝脏触诊（2分）。 2、肝脏双手触诊法：检查者右手位置同单手法（1分），而用左手托住被检查者右腰部（1分），拇指张开置于肋部（1分），触诊时左手向上推（1分），使肝下缘紧贴前腹壁下移（1分），并限制右下胸扩张以增加膈下移的幅度（1分），这样吸气时下移的肝脏就更易碰到右手指（1分），可提高触诊的效果。","max":7,"id":19},{"group":"触诊","text":"肝-颈静脉回流征","max":1,"id":20},{"group":"触诊","text":"Murphy征：左手拇指按压于胆囊点处，其余四指及手掌平放于右前下胸壁。让受检者缓慢深吸气，如在吸气过程中突然屏气者为Murphy征阳性。","max":3,"id":21},{"group":"触诊","text":"脾脏触诊：左手掌置于被检者左腰部第9-11肋处，将其脾从后向前托起（1分），右手掌平放于脐部（1分），右手三指（示、中、环指）伸直并拢，与肋缘大致呈垂直方向（1分），从脐水平开始，配合被检者腹式呼吸，用示、中指末端桡侧进行触诊，直至触及脾缘或左肋缘（1分）。平卧位后未触及，使用侧卧位触诊（1分）","max":5,"id":22},{"group":"触诊","text":"肾脏触诊，以左手掌从后面托起右腰部。右手掌平放在右腰部，手指尺侧大致平行于右肋缘向右上腹方向进行深触诊。于患者吸气时双手配合夹触肾脏。","max":4,"id":23},{"group":"触诊","text":"液波震颤：嘱患者一手立掌置于正中线（1分），检查者左手冲击左侧腹（1分），右手于右侧腹部感知（1分）","max":3,"id":24},{"group":"触诊","text":"振水音：听诊器置于剑突下胃区或低头直接听（1分），四指并拢快速冲击左上腹（1分）","max":2,"id":25},{"group":"注意事项","text":"操作轻柔、注意患者感受","max":2,"id":26},{"group":"注意事项","text":"操作过程中无过多改变患者体位，造成过多不适","max":3,"id":27},{"group":"注意事项","text":"操作完毕后复原患者衣物、被褥","max":3,"id":28},{"group":"注意事项","text":"告知患者检查结果","max":2,"id":29}],"sum":101,"note":"原表备注：不按视、听、叩、触诊顺序检查扣10分。"},{"id":7,"name":"脊柱四肢","section":"02-7","rows":[{"group":"准备","text":"医师准备：穿工作服，戴口罩、帽子，洗手（可口述）","max":2,"id":1},{"group":"准备","text":"操作前告知患者检查内容及目的，取得患者同意","max":2,"id":2},{"group":"准备","text":"评估环境，保护患者隐私","max":2,"id":3},{"group":"准备","text":"完全暴露患者检查部位，注意保暖","max":2,"id":4},{"group":"准备","text":"体位：坐位或者卧位（医者立于患者右侧）","max":2,"id":5},{"group":"脊柱","text":"1、弯曲度：视诊脊柱生理弯曲有无畸形","max":2,"id":6},{"group":"脊柱","text":"2、活动度：检查脊柱前屈、后伸、侧弯旋转运动","max":4,"id":7},{"group":"脊柱","text":"3、压痛：用拇指或示指指腹，自上而下依次按压脊柱棘突和横突部、椎旁肌肉，","max":2,"id":8},{"group":"脊柱","text":"4、直接叩痛：用手指尖或扣诊锤直接叩击各个脊椎棘突","max":2,"id":9},{"group":"脊柱","text":"5、间接叩痛：左手掌置于被检查者背部，右手握拳以尺侧缘叩击左手背，如被检者出现疼痛，称叩击痛阳性。","max":2,"id":10},{"group":"上肢","text":"上肢长度：双上肢长度正常情况下等长，长度不一见于先天性短肢畸形，骨折重叠和关节脱位等。","max":2,"id":11},{"group":"肩关节","text":"肩关节外形：双肩姿势外形有无倾斜","max":2,"id":12},{"group":"肩关节","text":"肩关节运动：嘱患者做自主运动，观察有无活动受限，或检查者固定肩胛骨，另一手持前臂进行多个方向的活动。","max":2,"id":13},{"group":"肩关节","text":"肩关节压痛点：肩关节周围不同部位的压痛点，对鉴别诊断很有帮助，肱骨结节间的压痛见于肱二头肌长头腱鞘炎，肱骨大结节压痛可见于冈上肌腱损伤。肩峰下内方有触痛，可见于肩峰下滑囊炎。","max":3,"id":14},{"group":"肘关节","text":"肘关节形态：正常肘关节双侧对称、伸直时肘关节轻度外翻，称携物角约50～150","max":2,"id":15},{"group":"肘关节","text":"肘关节运动：肘关节活动正常时屈1350～1500，伸100，旋前(手背向上转动)800～900，旋后(手背向下转动)800～900。","max":4,"id":16},{"group":"肘关节","text":"肘关节触诊：肘关节周围皮肤温度，有无肿块，肱动脉搏动，桡骨小头是否压痛，滑车淋巴结是否肿大。","max":3,"id":17},{"group":"腕关节","text":"腕关节及手外形：手的功能位置为腕背伸300并稍偏尺侧，拇指于外展时掌屈曲位，其余各指屈曲，呈握茶杯姿势。","max":2,"id":18},{"group":"腕关节","text":"腕关节及手局部是否肿胀与隆起","max":2,"id":19},{"group":"腕关节","text":"腕关节及手畸形：是否有腕垂症、猿掌、爪形手、餐叉样畸形、杵状指(趾)、匙状甲","max":2,"id":20},{"group":"腕关节","text":"腕关节及手运动：腕关节及指关节的背伸、掌屈、内收(桡侧)、外展(尺侧)是否在正常范围内。","max":2,"id":21},{"group":"髋关节","text":"步态：是否跛行、鸭步、呆步","max":3,"id":22},{"group":"髋关节","text":"畸形：内收畸形、外展畸形、旋转畸形","max":3,"id":23},{"group":"髋关节","text":"肿胀及皮肤皱褶：腹股沟、臀肌、臀部皱褶是否有异常改变","max":3,"id":24},{"group":"髋关节","text":"肿块、窦道瘢痕：注意髋关节周围皮肤有无肿块，窦道、瘢痕","max":3,"id":25},{"group":"髋关节","text":"压痛：腹股沟韧带中点后下1cm再向外1cm处有无压痛、波动感","max":4,"id":26},{"group":"髋关节","text":"活动度：髋关节屈曲、后申、内收、外展、旋转是否在正常范围内","max":5,"id":27},{"group":"髋关节","text":"叩诊：患者下肢伸直，以拳叩击足跟，如髋部疼痛，则示髋关节炎或骨折。","max":4,"id":28},{"group":"髋关节","text":"听诊：嘱患者做屈髋和伸髋动作，可闻及大粗隆上方有明显的“咯噔”声，系紧张肥厚的阔筋膜张肌与股骨大粗隆摩擦声。","max":2,"id":29},{"group":"膝关节","text":"视诊：是否有膝外翻、膝内翻、膝反张、肿胀、肌萎缩","max":5,"id":30},{"group":"膝关节","text":"触诊：压痛、肿块、摩擦感、活动度","max":4,"id":31},{"group":"踝关节","text":"视诊：肿胀、局限性隆起、畸形","max":3,"id":32},{"group":"踝关节","text":"触诊：压痛点、活动度、其他","max":3,"id":33},{"group":"注意事项","text":"操作轻柔、注意患者感受","max":2,"id":34},{"group":"注意事项","text":"操作过程中无过多改变患者体位，造成过多不适","max":3,"id":35},{"group":"注意事项","text":"操作完毕后复原患者衣物、被褥","max":3,"id":36},{"group":"注意事项","text":"告知患者相应检查结果","max":2,"id":37}],"sum":100,"note":""},{"id":8,"name":"深反射","section":"02-8","rows":[{"group":"准备","text":"医师准备：穿工作服(0.5分)，戴口罩(0.5分)、帽子(0.5分)，洗手（可口述0.5分）","max":2,"id":1},{"group":"准备","text":"操作前告知患者或家属检查内容及目的(1分)，取得患者或家属同意(1分)","max":2,"id":2},{"group":"准备","text":"环境准备：环境温暖、明亮(口述)(1分)","max":1,"id":3},{"group":"肱二头肌反射","text":"患者前臂屈曲(1分)、放松(1分)，检查者以左拇指置于患者肘部肱二头肌腱上(1分)，然后右手持叩诊锤叩击左拇指(1分)，可使肱二头肌收缩(1分)，前臂快速屈曲(1分)。反射中枢为颈髓5～6节(1分)。重复1～2次（1分），同法检查对侧（2分）","max":10,"id":4},{"group":"肱三头肌反射","text":"患者外展前臂半屈肘关节(1分)、放松(1分)，检查者用左手托住其前臂(1分)，右手用叩诊锤直接叩击鹰嘴上方的肱三头肌腱(1分)，可使肱三头肌收缩(1分)，引起前臂伸展(1分)。反射中枢为颈髓6～7节(1分)。重复1～2次（1分），同法检查对侧（2分）","max":10,"id":5},{"group":"桡骨膜反射","text":"被检者前臂置于半屈半旋前位(1分)、放松(1分)，检查者以左手托住其前臂并使腕关节自然下垂(1分)，随即以叩诊锤叩桡骨茎突(1分)，可引起肱桡肌收缩(1分)，发生屈肘和前臂旋前动作(1分)。反射中枢在颈髓5～6节(1分)。重复1～2次（1分），同法检查对侧（2分）","max":10,"id":6},{"group":"膝反射","text":"坐位检查时患者小腿完全松弛（1分）下垂与大腿成直角（1分），用右手持叩诊锤叩击膝盖髌骨下方股四头肌腱（2分），可引起小腿伸展（2分）。反射中枢在腰髓2～4节(1分)。重复1～2次（1分），同法检查对侧（2分）。（卧位检查则患者仰卧检查者以左手托起其膝关节使之松弛（1分）屈曲约1200（1分））","max":10,"id":7},{"group":"跟腱反射","text":"患者仰卧，髋及膝关节屈曲（1分），下肢取外旋外展位（1分）。检查者左手将患者足部背屈成直角（1分），以叩诊锤叩击跟腱（1分），反应为腓肠肌收缩（1分），足向跖面屈曲（1分）。反射中枢为骶髓1～2节(1分)。重复1～2次（1分），同法检查对侧（2分）","max":10,"id":8},{"group":"髌阵挛","text":"患者仰卧，下肢伸直（1分），检查者以拇指与示指控住其髌骨上缘（1分），用力向远端快速连续推动数次后维持推力（2分）。阳性反应为股四头肌发生节律性收缩使髌骨上下移动（2分），系腱反射极度亢进(1分)。重复1～2次（1分），同法检查对侧（2分）","max":10,"id":9},{"group":"反射强度的临床意义","text":"反射强度通常分为以下几级：(每个要点5分) 0：反射消失 1+：肌肉收缩存在，但无相应关节活动，为反射减弱 2+：肌肉收缩并导致关节活动，为正常反射 3+：反射增强，可为正常或病理状况 4+：反射亢进并伴有阵挛，为病理状况","max":25,"id":10},{"group":"注意事项","text":"检查前搓热双手，动作轻柔、态度亲切，关注病人的感受","max":4,"id":11},{"group":"注意事项","text":"操作完毕后复原患者衣物、被褥","max":3,"id":12},{"group":"注意事项","text":"最后向患者交代检查后得到的初步结论","max":3,"id":13}],"sum":100,"note":""},{"id":9,"name":"病理反射与脑膜刺激征","section":"02-9","rows":[{"group":"准备","text":"医师准备：穿工作服，戴口罩、帽子，洗手（可口述）","max":2,"id":1},{"group":"准备","text":"操作前告知患者检查内容及目的，取得患者同意","max":2,"id":2},{"group":"准备","text":"评估环境","max":1,"id":3},{"group":"准备","text":"物品准备：钝头棉签","max":1,"id":4},{"group":"准备","text":"体位：取仰卧位，全身放松（2分），检查者立于患者右侧（2分）","max":4,"id":5},{"group":"Babinski征","text":"用钝头竹签沿足底外侧缘（2分）；由后向前至小趾跟部（1分）并迅速转向内侧（2分）","max":5,"id":6},{"group":"Babinski征","text":"重复1～2次（1分），同法检查对侧（3分）","max":4,"id":7},{"group":"Babinski征","text":"口述阳性结果：拇趾背屈（1分），余趾呈扇形展开（1分）","max":2,"id":8},{"group":"Hoffmann征","text":"检查者用左手持被检者腕关节上方（1分），使其腕关节稍背伸（1分），右手以中指及食指挟持被检者中指第二节（1分），稍向上提使腕部处于轻度过伸位（1分），以拇指迅速弹刮患者中指指甲（1分）。","max":5,"id":9},{"group":"Hoffmann征","text":"重复1～2次（1分），同法检查对侧（3分）","max":4,"id":10},{"group":"Hoffmann征","text":"口述阳性结果：其余四指掌屈反应。","max":2,"id":11},{"group":"Oppenheim征","text":"检查者用拇指及示指（2分）沿患者小腿胫骨前缘用力由上向下滑压（3分）","max":5,"id":12},{"group":"Oppenheim征","text":"重复1～2次（1分），同法检查对侧（3分）","max":4,"id":13},{"group":"Oppenheim征","text":"口述阳性结果：拇趾背屈（1分）和/或余趾呈扇形展开（1分）","max":2,"id":14},{"group":"Gordon征","text":"检查时用手用力挤捏腓肠肌（5分）","max":5,"id":15},{"group":"Gordon征","text":"重复1～2次（1分），同法检查对侧（3分）","max":4,"id":16},{"group":"Gordon征","text":"口述阳性结果：拇趾背屈（1分）和/或余趾呈扇形展开（1分）","max":2,"id":17},{"group":"颈强直","text":"患者仰卧（1分），颈部放松（1分），检查者左手托患者枕部（1分），右手不置于患者前胸上部（1分）。向两侧轻轻转动1-2次（1分），以左手力量托起枕部作屈颈动作（2分），使颏部尽量接近胸部（2分）","max":9,"id":18},{"group":"颈强直","text":"口述阳性结果：被动屈颈活动受限（2分）。在除外颈椎或颈部肌肉局部病变后（2分），即可认为有脑膜刺激征（1分）。","max":5,"id":19},{"group":"Kernig征","text":"患者仰卧（1分），一侧下肢髋、膝关节屈曲成直角（1分），检查者将患者小腿抬高伸膝（1分）。正常人膝关节可伸达1350（2分）。","max":5,"id":20},{"group":"Kernig征","text":"重复1～2次（1分），同法检查对侧（3分）","max":4,"id":21},{"group":"Kernig征","text":"口述阳性结果：伸膝受阻且伴疼痛与屈肌痉挛。","max":2,"id":22},{"group":"Brudzinski征","text":"患者仰卧（1分），下肢伸直（1分），检查者一手托起患者枕部（2分），另一手按于其胸前（1分）。","max":5,"id":23},{"group":"Brudzinski征","text":"重复1～2次（1分），同法检查对侧（3分）","max":4,"id":24},{"group":"Brudzinski征","text":"口述阳性结果：双膝关节和髋关节同时屈曲","max":2,"id":25},{"group":"注意事项","text":"检查时搓热双手，动作轻柔、态度亲切，关注病人的感受","max":4,"id":26},{"group":"注意事项","text":"操作完毕后复原患者衣物、被褥","max":3,"id":27},{"group":"注意事项","text":"最后向患者交代检查后得到的初步结论","max":3,"id":28}],"sum":100,"note":""}];
const NEW_DOC_NOTES={"1":[{"loc":12,"text":"嘱被检查者休息30min，移走周围冷热源"},{"loc":13,"text":"用纱布擦干被检查者腋窝汗液"},{"loc":14,"text":"从消毒缸中取出体温计，将体温计的汞柱甩至35℃以下，把体温计水银端放在被检查者腋窝深处紧贴皮肤，嘱被检查者用上臂将体温计夹紧，10分钟后读数。"},{"loc":15,"text":"10分钟到，取出体温计，读数时平视体温计刻度线"},{"loc":16,"text":"将体温计的汞柱甩至35℃以下，放回消毒缸中"},{"loc":17,"text":"报告考官，此被检查者体温为**℃"}],"2":[{"loc":19,"text":"用三指（示、中、环指）触摸桡动脉，触诊时间30秒"},{"loc":20,"text":"报告考官，此被检查者脉搏为**次/分，节律整齐，强弱中等，未触及异常脉搏"}],"3":[{"loc":22,"text":"男性和儿童以腹式呼吸为主，女性以胸式呼吸为主"},{"loc":23,"text":"充分暴露被检查者的腹部和胸部，在自然的柔和光下，观察胸壁起伏的次数,计时1分钟"},{"loc":24,"text":"报告考官：该青年男性，以腹式呼吸为主，呼吸频率12-20次/分"}],"4":[{"loc":26,"text":"用物准备：听诊器、血压计"},{"loc":27,"text":"嘱被检查者休息30min"},{"loc":28,"text":"协助被检查者挽起袖子，请被检查者放松配合"},{"loc":29,"text":"检查血压计，打开水银槽开关，驱尽袖带内空气，检查无漏气，可使用"},{"loc":30,"text":"将袖带平整地缠于被检查者右上臂中部，下缘距离肘上2横指，松紧以能放进一指为宜，气袖中央位于肱动脉表面"},{"loc":31,"text":"触摸肱动脉搏动位置，带听诊器，将听诊器体件置于肱动脉位置（放听诊器前，先用手焐热）"},{"loc":32,"text":"保持血压计零点、听诊器体件、右心房位于同一水平"},{"loc":33,"text":"向袖带内充气，边充气边听诊，待肱动脉搏动声消失，再升高30mmHg后，缓慢放气，双眼随汞柱下降，平视汞柱表面，根据听诊结果读出血压值"},{"loc":34,"text":"嘱被检查着休息1-2分钟，不饮浓茶、咖啡，再次测量血压，取2次读数的平均值（如收缩压/舒张压2次读数相差5mmHg以上，应再次测量，以3次读数的平均值作为测量结果）"},{"loc":35,"text":"报告考官：该被检查者血压***/**mmHg"}],"5":[{"loc":40,"text":"测体重：（穿单衣单裤，脱鞋）"},{"loc":41,"text":"被检查者脱鞋，单衣站立在身高和体重的测量仪器底座上，站立位置正确，身体站直，观察重表的读数（读数精确到小数点后面一位）"},{"loc":42,"text":"报告考官：此被检查者体重为**kg"}],"6":[{"loc":36,"text":"测身高：（穿单衣单裤，脱鞋）"},{"loc":37,"text":"用物准备：体重秤完好无损，刻度归零。"},{"loc":38,"text":"患者脱鞋，站在身高和体重的测量仪器上面，头、臀、足跟三点紧靠测量柱，头顶最高点与测量仪立柱的垂直线的交叉点即身高的读数"},{"loc":39,"text":"报告考官：此被检查者身高为***cm"}],"7":[],"8":[{"loc":43,"text":"测头围："},{"loc":44,"text":"用软卷尺齐眉弓上缘，后经枕骨粗隆，左右对称环绕一周"},{"loc":45,"text":"报告考官：①此被检查者头围为**cm②新生儿头围平均约34cm，前半年约增加8-10cm，后半年约增加2-4cm2岁时达48cm，第二年仅增加2cm，5岁时50cm,15岁时接近成人头围，约54-58cm"}],"9":[{"loc":279,"text":"触诊四肢皮温、关节、肌肉、皮肤弹性、毛细血管充盈时间、足背动脉搏动、"},{"loc":280,"text":"按压胫前皮肤，观察有无肿胀和凹陷；"}],"10":[{"loc":275,"text":"皮肤：无红肿、破溃，无瘢痕、色素沉着，无水肿，无肝掌，下肢无静脉曲张"},{"loc":277,"text":"手指：无畸形，无缺指，无多指，无杵状指，指甲无反甲，甲床红润无发绀"}],"11":[{"loc":76,"text":"1.头颈部淋巴结检查：（头颈部淋巴结检查不可以双手两侧同时检查。手紧贴检查部位，由浅及深进行滑动触诊）"},{"loc":77,"text":"顺序：耳前、耳后、枕后、颌下、颏下、颈前、颈后、锁骨上（取坐位或仰卧位，头部稍向前屈，左手触病人右侧，右手触病人左侧，由浅部逐渐触摸至锁骨后深部，双手同时触摸）"},{"loc":78,"text":"2.腋窝淋巴结：握手姿势，5组淋巴结顺序：尖群-中央群-胸肌群-肩胛下群-外侧群（同法检查对侧）"},{"loc":79,"text":"3.滑车淋巴结：握手姿势，检查从其上臂外侧伸至肱二头肌内侧，于肱骨内上髁上3—4cm上下滑动触膜滑车上淋巴结"},{"loc":80,"text":"4.腹股沟淋巴结：右手四指并拢，以指腹触及腹股沟，由浅及深滑动触诊，先触摸腹股沟韧带下方水平组淋巴结，再触膜腹股沟大隐静脉处和垂直组淋巴结，左、右腹股沟对比检查"},{"loc":81,"text":"5.腘窝淋巴结：屈膝，检查者右手绕过患者膝盖，用右手并拢的示指、中指、环指、小指指腹在右侧腘窝部进行触摸（同法做对侧)"},{"loc":82,"text":"报告结果:全身浅表淋巴结无肿大，如果有肿大淋巴结，描述：大小、形状、部位、数目、压痛、活动度、有无粘连等"}],"12":[{"loc":51,"text":"4、视诊双眼、眉毛、睫毛。(双眼对称，眉毛浓密，无脱落，睫毛无倒睫，根部无溃疡)。"},{"loc":52,"text":"5、观察眼睑，翻转，上眼脸，观察上下脸结膜、穹癯结膜、球结膜、巩膜及角膜，先左后右。(眼睑无水肿，上睑无下垂，无倒睫，眼裂无闭合障碍，睑结膜无苍白、充血，球结膜无充血、水肿，巩膜无黄染、无充血，角膜透明无浑浊、无溃疡)。"}],"13":[{"loc":55,"text":"8、检查左右眼球运动。嘱被检查者固定头位，眼球随目标方向移动（指尖置于被检查者眼前30-40cm），示指按水平向外->外上->外下一>水平向内一>内上一>内下,共6个方向进行，检查每个方向时均从中位开始。(眼球运动正常)。"}],"14":[{"loc":53,"text":"6、观察眼球的外形、双侧瞳孔。(眼球无突出、无凹陷，双侧瞳孔等大等圆，直径3mm)。"}],"15":[{"loc":54,"text":"7、取手电筒，检查左右瞳孔的直接和间接对光反射（注意遮挡灯光）。(直接对光反射、间接对光反射正常)。"}],"16":[{"loc":62,"text":"15、观察口唇;用消毒压舌板观察口腔粘膜、牙齿、牙龈、扁桃体（嘱被检查者头略后仰，口张大并发“啊”音，压舌板置于舌前2/3与舌后1/3处）、咽后壁等;观察舌体、舌苔、伸舌运动、鼓腮、示齿动作。(口无畸形，唇红，无皲裂、无肥厚、口角无歪斜;口腔无出血、溃疡;牙齿无缺齿、无龋齿、无义齿;牙龈无出血、无萎缩;扁桃体无肿大、咽部粘膜无充血、无假膜，悬雍垂居中，咽后壁无充血、无滤泡增生;伸舌居中，舌体无肥大、舌苔薄白;鼓腮无漏气，示齿正常)。扁桃体肿大分度：Ⅰ度：不超过咽腭弓，Ⅱ度：超过咽腭弓，但未达咽后壁正中线；Ⅲ度：超过咽后壁正中线"}],"17":[{"loc":70,"text":"2.触诊甲状腺峡部和左右叶。右手拇指（后面用示指）在胸骨上切迹向上触摸，请受检者作吞咽动作;用左手拇指在甲状软骨下气管右侧向对侧轻推右手示指、中指和环指在左胸锁乳突肌后缘，右手拇指在气管旁滑动触摸，请被检者吞咽;同法检查甲状腺右叶。(甲状腺无肿大、表面光滑、无结节、无压痛)。甲状腺肿大分度：Ⅰ度：不能看到，但能触及；Ⅱ度：能看到又能触及，但未超过胸锁乳突肌后缘；Ⅲ度：超过胸锁乳突肌后缘"}],"18":[{"loc":67,"text":"嘱被检查者双手抱头，头稍后仰，观察颈部皮肤、血管，先左后右，观察甲状腺。(颈部外形正常，皮肤无红肿、破溃、无蜘蛛痣；甲状腺视诊无肿大；颈静脉检查：正常人立位或坐位时颈静脉常不显露，半坐位，身体呈45°，颈静脉充盈水平不超过锁骨上缘至下颌角之间的下2/3水平。颈动脉检查：颈动脉无异常搏动)。"},{"loc":72,"text":"4.触诊颈动脉搏动，位于甲状软骨外侧两横指，触诊1min（被检查者颈动脉搏动**次/分，节律整齐、强弱中等）"},{"loc":74,"text":"颈部血管性杂音，先左后右。（甲状腺未触及肿大无需听诊，听诊颈部无血管杂音)。"}],"19":[{"loc":89,"text":"肺部体格检查：（所有操作皆从左向右开始）"},{"loc":90,"text":"前侧胸"}],"20":[{"loc":92,"text":"俯视30s,平视30s（视线与胸廓平齐，看表动作）"},{"loc":94,"text":"2.胸廓形态：两侧对称，大小正常，无鸡胸、漏斗胸、桶状胸"}],"21":[{"loc":93,"text":"1.胸壁皮肤：无皮疹，无红肿、破溃，无瘢痕，无色素沉着，无蜘蛛痣，胸壁静脉无充盈曲张"}],"22":[{"loc":95,"text":"3.呼吸运动：腹式呼吸为主，无三凹征，无呼吸困难"},{"loc":96,"text":"4.呼吸频率：18次/分，未见浅快及深大呼吸"},{"loc":97,"text":"5.呼吸节律均匀整齐，无潮式呼吸，无间停呼吸，无叹气样呼吸及抑制性呼吸"}],"23":[{"loc":99,"text":"1.胸壁、胸骨、胸廓、胸廓挤压征（胸壁无皮下气肿，胸壁胸骨无压痛，胸廓挤压佂阴性）"},{"loc":100,"text":"2.胸廓扩张度：两手掌及伸展的手指置于胸廓前下部的对称位置，左右拇指分别沿两侧肋缘指向剑突，两拇指间距约2cm。然后嘱被检者作深呼吸动作。（前胸胸廓扩张度双侧对称一致）"},{"loc":101,"text":"3.语音震颤：将双手小鱼际置于被检者胸部上、中、下三部位的对称位置,嘱其以同等强度发“yi”长音,并双手作一次交换。（前3，侧2，后4，）两侧语音震颤一致，无增强及减弱）"},{"loc":102,"text":"4.胸膜摩擦感：双手掌置于被检者前下侧胸壁/腋中线5、6肋间，（未触及胸膜摩擦感，若触及胸膜摩擦感嘱被检查者屏住呼吸与心包摩擦感相鉴别）"},{"loc":109,"text":"1.前胸、侧胸听诊：位置同叩诊，每处听诊1-2个呼吸周期。（1个呼吸周期为四秒，位置与叩诊一致）"},{"loc":110,"text":"报告结果：听诊肺野呼吸音清，未闻及异常呼吸音及干湿啰音"},{"loc":111,"text":"2.语音共振：位置同语音震颤"},{"loc":112,"text":"报告结果：两侧语音共振一致，无增强及减弱"},{"loc":113,"text":"3.胸膜摩擦音：位置同胸膜摩擦感"},{"loc":114,"text":"报告结果：未闻及胸膜摩擦音，若闻及胸膜摩擦音嘱被检查者屏住呼吸与心包摩擦音相鉴别"}],"24":[{"loc":103,"text":"叩诊：顺序：先左后右、从上到下、由外向内，进行对比叩诊；"},{"loc":104,"text":"1.前胸部对比叩诊：叩诊从锁骨上窝开始，然后第一肋间，沿锁骨中线和腋前线逐一向下叩诊（从第三肋开始扣腋前线，从第四肋开始叩腋中线）；直至肺下界。后查侧胸，被检查者举起上臂置于头部，沿腋中线逐一向下叩诊，直至肺下界。"},{"loc":105,"text":"报告结果：双肺叩诊清音。"},{"loc":124,"text":"坐位，被检查者向前稍低头，双手交叉抱肘，尽可能使肩胛骨移向外侧方，上半身略向前倾，对比叩诊肩胛上区，肩甲间区，肩甲下区"},{"loc":126,"text":"1.背部对比叩诊：避开肩胛骨，肩胛区扳指与脊柱平行，叩诊肩胛上区，肩甲间区，肩甲下区，直至肺下界。后查侧胸，被检查者举起上臂置于头部，沿腋后线逐一向下叩诊，直至肺下界。（从第7肋开始叩诊腋后线）"},{"loc":127,"text":"报告结果：双肺叩诊清音。"}],"25":[{"loc":106,"text":"2.前胸肺下界叩诊：由于心脏位于左侧，避开心脏，沿右侧锁骨中线，由上往下逐一叩诊，当由清音变为实音时则为肺下界的位置。后查侧胸，被检查者举起上臂置于头部，沿左右腋中线逐一向下叩诊，直至肺下界。（前胸：锁骨中线第五肋由清音变浊音为肝上界，第六肋由浊音变实音为肺下界）"},{"loc":107,"text":"报告结果：肺下界位于锁骨中线的第6肋间，腋中线第8肋间。"},{"loc":128,"text":"2.肩胛线肺下界叩诊：沿肩胛线逐一向下叩诊，直至肺下界。（同法做对侧）"},{"loc":129,"text":"报告结果：肺下界位于肩胛线的第10肋间。"}],"26":[{"loc":130,"text":"3.肺下界移动度叩诊：首先在平静呼吸时，于肩胛线上叩出肺下界的位置；嘱作深吸气后在屏住呼吸的同时，沿该线继续向下叩诊，清音变为浊音时，标记；"},{"loc":131,"text":"当受检者恢复平静呼吸后，先于肩胛线上叩出平静呼吸时的肺下界；再嘱作深呼气并屏住呼吸，再由下向上叩诊，至浊音变为清音时，标记。测量两点距离。（向上叩1肋，向下叩2肋）"},{"loc":132,"text":"报告结果：肺下界移动度为6-8cm（同法做对侧）"}],"27":[{"loc":84,"text":"视诊：水平视诊30s，切线水平视诊30s（要同性别医务人员陪同）"},{"loc":85,"text":"报告结果：双侧乳房大小相同，位置对称，皮肤无红肿、破溃，无橘皮样改变，无酒窝征，乳头无回缩、内陷，无异常分泌物"}],"28":[{"loc":87,"text":"先查健侧,后查患侧。按外上、外下、内下、内上顺序由浅入深触诊,最后触诊乳头。"},{"loc":88,"text":"结果回报：乳房无压痛，未触及包块，乳头无溢液"}],"29":[{"loc":140,"text":"患者取卧位，医师视线与胸廓同高。平视30s，俯视30s"},{"loc":141,"text":"观察有无心前区隆起及心尖搏动"},{"loc":142,"text":"报告结果：心前区无异常隆起，无异常搏动，心尖搏动位于第5助间左锁骨中线内侧0.5-1Cm处，搏动范围约2cm.未见增强及减弱，未见负性心尖搏动。"}],"30":[{"loc":147,"text":"1.触诊心尖搏动：使用右手掌，后使用小鱼际，最后使用中指和食指指腹触诊心尖搏动，测量搏动范围"},{"loc":148,"text":"报告结果：心尖搏动位于第5肋间左锁骨中线内0.5-1cm处，搏动范围直径2cm。未及增强及减弱。"},{"loc":149,"text":"2.触诊震颤：分别在心尖区（心尖搏动最强点）、肺动脉瓣区（胸骨左缘第2肋间）、主动脉瓣区（胸骨右缘第2肋间）、主动脉瓣第二听诊区（胸骨左缘第3肋间）、三尖瓣区（胸骨左缘,4，5肋间）"},{"loc":150,"text":"报告结果：心脏各瓣膜区未触及震颤"},{"loc":151,"text":"3.触诊心包摩擦感：在心前区及胸骨左缘第3,4肋间触诊"},{"loc":152,"text":"报告结果：未触及心包摩擦感，若触及心包摩擦感嘱患者屏住呼吸，与胸膜摩擦感鉴别"}],"31":[{"loc":154,"text":"1.左心界顺序：先左后右，从下到上，从外到内。"},{"loc":156,"text":"从心尖搏动外2cm开始叩诊，从外到内由清音变为浊音时，标记，逐个肋间向上，直至第二肋间。"},{"loc":157,"text":"2.右心界找到肝上界，沿右侧锁骨中线，由上往下逐一叩诊，当由清音变为浊音时则为肝上界。"},{"loc":158,"text":"从肝上界上一个肋间开始叩诊，从外到内由清音变为浊音时，标记，逐个肋间向上，直至第二肋间。"},{"loc":162,"text":"报告结果：左锁骨中线与前正中线的距离为9cm（8-10cm）"},{"loc":164,"text":"报告结果：心浊音界左界第5、4、3、2肋距前正中线7-9、5-6、3.5-4.5、2-3cm"},{"loc":165,"text":"心浊音界右界第4、3、2肋距前正中线3-4、2-3、2-3cm"}],"32":[{"loc":169,"text":"1.心尖搏动最强点听诊1min（使用右手掌，后使用小鱼际，最后使用中指和食指指腹触诊心尖搏动，放听诊器体件）"},{"loc":170,"text":"2.考生在被检查者身体上指出5个听诊区的名称、位置、顺序：二尖瓣区（心尖搏动最强点）、肺动脉瓣区（胸骨左缘第2肋间）、主动脉瓣区（胸骨右缘第2肋间）、主动脉瓣第二听诊区（胸骨左缘第3肋间）、三尖瓣区（胸骨左缘,4，5肋间）"},{"loc":171,"text":"3.心包摩擦音:胸骨左缘第3、4肋间"},{"loc":172,"text":"结果回报：心率**次/分，律齐，心音正常、无增强及减弱，无杂音，无额外心音、未闻及心包摩擦音，若闻及摩擦音则嘱患者屏住呼吸与胸膜摩擦音相鉴别"}],"33":[{"loc":182,"text":"2.血管杂音：腹主动脉（两侧肋弓下缘与腹正中线交点）"},{"loc":183,"text":"双侧肾动脉（两侧肋弓下缘与腹直肌外缘交点）"},{"loc":184,"text":"双侧髂动脉（两侧髂前上棘与腹直肌外缘交点）"},{"loc":185,"text":"双侧股动脉（两侧腹股沟韧带中点稍下方）"},{"loc":186,"text":"脐周静脉（脐周）"},{"loc":187,"text":"报告结果：腹主动脉、肾动脉、髂动脉、股动脉未闻及血管杂音，股动脉无枪击音、无杜氏双重杂音，脐周静脉无血管杂音。"}],"34":[{"loc":185,"text":"双侧股动脉（两侧腹股沟韧带中点稍下方）"},{"loc":187,"text":"报告结果：腹主动脉、肾动脉、髂动脉、股动脉未闻及血管杂音，股动脉无枪击音、无杜氏双重杂音，脐周静脉无血管杂音。"}],"35":[{"loc":190,"text":"触诊：注：九分法： 上水平线为两侧肋弓下缘最低点的连线，下水平线为两侧髂前上棘连线。两条垂直线为通过左右髂前上棘至腹中线连线的中点所作的垂直线。"}],"36":[{"loc":175,"text":"腹部外形、呼吸运动、腹壁静脉、胃肠型、蠕动波、色素沉着、腹纹、瘢痕、疝、脐，"},{"loc":176,"text":"报告结果：被检查者腹部平坦，无隆起，无凹陷，腹壁皮肤无红肿、破溃，无瘢痕、色素沉着，无皮纹，腹壁静脉无充盈曲张，未见胃肠型，无蠕动波，无疝，脐部无异常分泌物"}],"37":[{"loc":177,"text":"测量腹围：软卷尺过脐，绕腹一周"},{"loc":178,"text":"报告结果：被检查者腹围**cm"}],"38":[{"loc":175,"text":"腹部外形、呼吸运动、腹壁静脉、胃肠型、蠕动波、色素沉着、腹纹、瘢痕、疝、脐，"},{"loc":187,"text":"报告结果：腹主动脉、肾动脉、髂动脉、股动脉未闻及血管杂音，股动脉无枪击音、无杜氏双重杂音，脐周静脉无血管杂音。"}],"39":[{"loc":191,"text":"1.腹壁紧张度、浅（2cm）、深（4cm）触诊：先将右手全手掌置于被检者腹壁上，感受被检者腹壁紧张程度，然后以轻柔动作开始触诊。自左下腹开始逆时针方向至右下腹，再至脐部。"},{"loc":192,"text":"报告结果：腹软，全腹无压痛，未触及包块，无血管搏动"},{"loc":193,"text":"2.麦氏点压痛及反跳痛：用并拢的示、中指触诊麦氏点（脐与右髂前上棘连线中外1/3处），出现压痛后，压于原处稍停片刻使疼痛趋于稳定，然后迅速抬起，观察被检查者有无痛苦表情，有无疼痛或者疼痛是否骤然加重。"},{"loc":194,"text":"报告结果：麦氏点无压痛及反跳痛"}],"40":[{"loc":191,"text":"1.腹壁紧张度、浅（2cm）、深（4cm）触诊：先将右手全手掌置于被检者腹壁上，感受被检者腹壁紧张程度，然后以轻柔动作开始触诊。自左下腹开始逆时针方向至右下腹，再至脐部。"},{"loc":192,"text":"报告结果：腹软，全腹无压痛，未触及包块，无血管搏动"}],"41":[{"loc":199,"text":"4.肝脏触诊：单手触诊：（单手和双手可任选一种）于右锁骨中线，髂前上棘开始，四指并拢、约与肋缘平行，嘱被检者做腹式呼吸，以指腹向上推动，吸气时上抬指腹但不离开腹壁，呼气时向下压腹壁，直至触及肝下缘或右肋缘；同样操作进行前正中线的肝脏触诊。双手触诊：检查者右手位置和手法同单手法，而用左手托住被检查者右腰部分，拇指张开置于左季肋部，嘱被检者做腹式呼吸，触诊时左手向上推，使肝下缘紧贴前腹壁下移，并限制右下胸扩张以增加膈下移的幅度，这样吸气时下移的肝脏就更易碰到右手指，直至触及肝下缘或右肋缘，同样操作进行前正中线的肝脏触诊。"},{"loc":200,"text":"报告检查结果：肝脏肋下及剑突下未触及。"},{"loc":203,"text":"6.脾脏触诊：左手掌置于被检者左胸下部（第9-11肋处）的后方，将其脾从后向前托起，右手掌平放于脐部，右手三指（示、中、环指）伸直并拢，与左侧肋缘大致呈垂直方向，从脐水平开始，配合被检者腹式呼吸，用示、中指末端桡侧进行触诊迎触脾尖，直至触及脾下缘或左肋缘。在脾轻度肿大而仰卧位不易触及，取右侧卧位触诊，双下肢屈曲"},{"loc":204,"text":"报告检查结果：脾脏未触及。"}],"42":[{"loc":201,"text":"5.Murphy征：左手掌平放于被检者右胸下部，拇指指腹按勾压于右侧腹直肌外缘和肋缘交界处或右锁骨中线与肋缘交界处，告知被检查做缓慢深吸气（腹式呼吸），若被检查者感觉拇指指腹勾压处触痛，和因疼痛而屏住呼吸称为Murphy征阳性。"},{"loc":202,"text":"报告检查结果：Murphy征阳性或阴性。"}],"43":[{"loc":188,"text":"3.振水音：听诊器置于剑突下胃区，四指并拢快速冲击左上腹"},{"loc":189,"text":"报告结果：未闻及气液相撞的声音，振水音阴性。"},{"loc":209,"text":"9.振水音：低头直接听，四指并拢快速冲击左上腹"},{"loc":210,"text":"报告结果：未闻及气液相撞的声音，振水音阴性。"}],"44":[{"loc":207,"text":"8.液波震颤：嘱患者一手立掌置于正中线，检查者左手冲击左侧腹，右手于右侧腹部感知"},{"loc":208,"text":"报告结果：未触及液体冲击腹壁的感觉，液波震颤阴性（液波震颤阳性提示腹水﹥3000ml）。"}],"45":[{"loc":212,"text":"1.全腹叩诊：左髂窝部-左腰部-左季肋部-上腹部-右季肋部-右腰部-右髂窝部-下腹部-脐部"},{"loc":213,"text":"报告结果：全腹叩诊呈鼓音"}],"46":[{"loc":216,"text":"3.肝脏叩诊：沿右锁骨中线，胸骨角平对第2肋，从第2肋向下叩诊，清音变浊音为肝上界，从脐水平线向上叩诊，鼓音变浊音为肝下界，测量肝上下径"},{"loc":217,"text":"报告结果：肝上下径为9-11cm"}],"47":[{"loc":214,"text":"2.移动性浊音：自腹中部脐水平开始，向左侧腹部叩诊，直至出现浊音，此时左手板指固定不离开腹壁；嘱被检者右侧卧位，于原处再继续叩诊，如呈鼓音表明浊音移动；自该处沿脐水平向右侧腹部叩诊，直至再度出现浊音；此时左手板指固定不动；在嘱被检者左侧卧位，在左手板指固定处再次叩诊，判断浊音是否为鼓音，如呈鼓音则为移动性浊音阳性。"},{"loc":215,"text":"报告结果：移动性浊音阴性或者阳性。（移动性浊音阳性提示腹水﹥1000ml）"}],"48":[{"loc":222,"text":"5.肋脊点叩痛：坐位，第12肋与脊柱的交点，双侧对比"},{"loc":223,"text":"报告结果：肋脊点无叩击痛。"},{"loc":224,"text":"6.肋腰点叩痛：坐位，第12肋与腰大肌的交点，双侧对比"},{"loc":225,"text":"报告结果：肋腰点无叩击痛"}],"49":[{"loc":220,"text":"4.膀胱叩诊：正中线上，由脐部叩至耻骨联合上方"},{"loc":221,"text":"报告结果：膀胱叩诊呈鼓音，膀胱无充盈"}],"50":[{"loc":179,"text":"听诊："},{"loc":180,"text":"1.肠鸣音：将听诊器体件置于被检者右下腹或脐周，听诊时间不少于1分钟。"},{"loc":181,"text":"报告结果：肠鸣音正常为4次/分"}],"51":[{"loc":182,"text":"2.血管杂音：腹主动脉（两侧肋弓下缘与腹正中线交点）"},{"loc":183,"text":"双侧肾动脉（两侧肋弓下缘与腹直肌外缘交点）"},{"loc":184,"text":"双侧髂动脉（两侧髂前上棘与腹直肌外缘交点）"},{"loc":185,"text":"双侧股动脉（两侧腹股沟韧带中点稍下方）"},{"loc":186,"text":"脐周静脉（脐周）"},{"loc":187,"text":"报告结果：腹主动脉、肾动脉、髂动脉、股动脉未闻及血管杂音，股动脉无枪击音、无杜氏双重杂音，脐周静脉无血管杂音。"}],"52":[{"loc":256,"text":"脊柱检查："},{"loc":258,"text":"后面：脊柱正直，无侧弯畸形"},{"loc":259,"text":"侧面：脊柱生理弯曲存在，颈曲、腰曲凸向前，胸曲、骶曲凸向后，无驼背"},{"loc":263,"text":"2.压痛：患者取端坐位，以右手拇指从枕骨粗隆自上而下逐个按压脊椎棘突和椎旁肌肉"},{"loc":264,"text":"报告结果：被检查者各脊椎棘突及椎旁肌肉无压痛"},{"loc":265,"text":"3.直接叩击痛：患者取坐位，叩击各椎体的棘突（第7颈椎棘突至骶椎）"},{"loc":266,"text":"报告结果：被检查者各脊椎棘突无叩痛"},{"loc":267,"text":"4.间接叩击痛：患者取坐位，医师左手掌置于其头部，右手半握拳以小鱼际肌叩击左手背，询问有无疼痛"},{"loc":268,"text":"报告结果：被检查者脊柱间接叩诊无叩击痛"},{"loc":270,"text":"检查者双手固定被检查者肩部/髂前上棘，嘱患者颈椎/腰椎前屈、后伸、侧弯、旋转"},{"loc":271,"text":"报告结果：被检查者颈椎、腰椎活动可"}],"53":[{"loc":274,"text":"视："},{"loc":275,"text":"皮肤：无红肿、破溃，无瘢痕、色素沉着，无水肿，无肝掌，下肢无静脉曲张"},{"loc":276,"text":"关节：无肿胀、畸形，无活动受限"},{"loc":277,"text":"手指：无畸形，无缺指，无多指，无杵状指，指甲无反甲，甲床红润无发绀"}],"54":[{"loc":284,"text":"指间关节（屈、伸，外展、内收，对指、对掌）、腕关节（屈、伸，桡侧、尺侧偏，环转）、肘关节（屈、伸）、肩关节（前伸、后伸，外展、内收，旋前、旋后，环转）；踝关节（跖屈、背伸）、膝关节（屈、伸）、髋关节（屈、伸，外展、内收，旋前、旋后，环转，“4”字佂）"}],"55":[],"56":[{"loc":279,"text":"触诊四肢皮温、关节、肌肉、皮肤弹性、毛细血管充盈时间、足背动脉搏动、"},{"loc":281,"text":"按压膝关节，观察膝关节有无压痛、肿胀"},{"loc":295,"text":"膝关节活动度检查：屈曲被检查者膝关节，观察小腿后部与大腿后部是否相贴，关节能否伸直，膝关节活动度0°-135°"}],"57":[{"loc":282,"text":"浮髌试验：患者取平卧位，下肢伸直放松，医师一手虎口卡于患膝髌骨上极，并加压压迫髌上囊，使关节液集中于髌骨底面，另一手示指垂直按压髌骨并迅速抬起（双侧）按压时髌骨与关节面有碰触感，松手时髌骨浮起，即为浮髌试验阳性，提示关节积液量﹥50ml"}],"58":[{"loc":309,"text":"肛门直检："},{"loc":310,"text":"视诊：肛门皮肤无红肿破溃、无菜花样改变、无脓性分泌物。"},{"loc":311,"text":"触诊：感受患者肛门直肠皱襞光滑、无压痛、无肿块、无搏动感"},{"loc":312,"text":"手套上无脓性分泌物及血迹。"}],"59":[{"loc":228,"text":"2.腹壁反射：被检者仰卧，下肢略屈曲使腹壁松弛，用钝头竹签分别沿肋缘下、脐平面及腹股沟上的方向，由外向内轻划两侧腹壁皮肤，正常可见受刺激部位腹肌收缩。反射中枢分别为胸髓7～8节；胸髓9～10节；胸髓11～l2节。"}],"60":[{"loc":232,"text":"1.肱二头肌反射：被检者前臂屈曲、放松，检查者以左拇指置于患者肘部肱二头肌腱上，然后右手持叩诊锤叩击左拇指，可使肱二头肌收缩，前臂快速屈曲。反射中枢为颈髓5～6节。重复1～2次，同法检查对侧"}],"61":[{"loc":233,"text":"2.肱三头肌反射：被检者外展前臂半屈肘关节、放松，检查者用左手托住其前臂，右手用叩诊锤直接叩击鹰嘴上方的肱三头肌腱，可使肱三头肌收缩，引起前臂伸展。反射中枢为颈髓6～7节。重复1～2次，同法检查对侧"}],"62":[{"loc":234,"text":"3.桡骨膜反射：被检者前臂置于半屈半旋前位、放松，检查者以左手托住其前臂并使腕关节自然下垂，随即以叩诊锤叩桡骨茎突，可引起肱桡肌收缩，发生屈肘和前臂旋前动作。反射中枢在颈髓5～6节。重复1～2次，同法检查对侧"}],"63":[{"loc":235,"text":"4.膝反射：坐位检查时患者小腿完全松弛，下垂与大腿成直角，用右手持叩诊锤叩击膝盖髌骨下方股四头肌腱，可引起小腿伸展。反射中枢在腰髓2～4节。重复1～2次，同法检查对侧。（卧位检查则患者仰卧检查者以左手托起其膝关节使之松弛，屈曲约1200"}],"64":[{"loc":236,"text":"5.跟腱反射：患者仰卧，髋及膝关节屈曲，下肢取外旋外展位。检查者左手将患者足部背屈成直角，以叩诊锤叩击跟腱，反应为腓肠肌收缩，足向跖面屈曲。反射中枢为骶髓1～2节。重复1～2次，同法检查对侧"}],"65":[{"loc":247,"text":"1.Babinski征：用钝头竹签沿足底外侧缘，由足跟部向前至小趾跟部并迅速转向内侧，重复1～2次，同法检查对侧。"},{"loc":248,"text":"口述阳性结果：拇趾背屈，余趾呈扇形展开"},{"loc":249,"text":"2.Oppenheim征(奥本海姆征)：检查者弯曲示指及中指，沿患者小腿胫骨前缘用力由上向下滑压重复1～2次，同法检查对侧。"},{"loc":250,"text":"口述阳性结果：拇趾背屈和/或余趾呈扇形展开，"},{"loc":251,"text":"3.Gordon征（戈登征）。：检查时用手用力挤捏腓肠肌，重复1～2次，同法检查对侧，"},{"loc":252,"text":"口述阳性结果：拇趾背屈和/或余趾呈扇形展开"},{"loc":253,"text":"4.Hoffmann征：检查者用左手持被检者腕关节上方，使其腕关节稍背伸，右手以中指及食指挟持被检者中指第二节，稍向上提使腕部处于轻度过伸位，以拇指迅速弹刮患者中指指甲。重复1～2次，同法检查对侧。"},{"loc":254,"text":"口述阳性结果：其余四指掌屈反应。"}],"66":[{"loc":240,"text":"颈强直：嘱被检者去枕仰卧，颈部放松除外颈椎病变，检查者左手托患者枕部，右手置于患者前胸上部，以左手力量托起枕部作屈颈动作，使颏部尽量接近胸部，体会被检者颈部有无抵抗感。"},{"loc":241,"text":"口述阳性结果：被动屈颈时抵抗力增强。"},{"loc":242,"text":"2.Kernig征：嘱被检者仰卧，一侧下肢髋、膝关节屈曲成直角，检查者将患者小腿抬高伸膝，正常人膝关节可伸达135°以上，重复1～2次，询问被检查者有无疼痛感。同法检查对侧。"},{"loc":243,"text":"口述阳性结果：伸膝受阻且伴疼痛或下肢屈肌牵拉痉挛。"},{"loc":244,"text":"3.Brudzinski征（布鲁津斯基征）：嘱被，检者去枕仰卧，下肢伸直，检查者一手托起患者枕部，另一手按于其胸前重复1～2次。"},{"loc":245,"text":"口述阳性结果：屈颈时双膝关节和髋关节同时屈曲"}]};

const MATERIAL_DIFFS=[{"title":"测血压前休息时间","topic":"生命体征","first":"《助理全身体格检查》写“休息30min”。","second":"2020年竞赛评分表02-1写“休息至少5分钟”。","advice":"按当前考试要求执行；不要将两个来源的休息时间视作同一评分规则。","refs":[4]},{"title":"呼吸频率计数时长","topic":"生命体征","first":"《助理全身体格检查》写“计时1分钟”。","second":"2020年竞赛评分表02-1写“观察30秒以上，计算呼吸频率”。","advice":"练习时标明所采用的版本，不应把30秒和1分钟混写为同一句标准。","refs":[3]},{"title":"腹部触诊深度","topic":"腹部","first":"《助理全身体格检查》写浅触诊2cm、深触诊4cm。","second":"此前《昭昭》考点整理使用浅约1cm、深约2cm。","advice":"不同教材描述存在差异，实际规范演示与考点要求优先。","refs":[39,40]},{"title":"腹部操作顺序","topic":"腹部","first":"《助理全身体格检查》正文编排为视诊→听诊→触诊→叩诊。","second":"2020年竞赛评分表02-6注明不按视→听→叩→触检查扣10分。","advice":"这是明确的评分差异；执行2020年竞赛评分训练时依其表内要求练习。","refs":[35]},{"title":"腹部评分小计","topic":"腹部","first":"2020年竞赛评分表02-6逐行分数相加为101分。","second":"同一表格末尾写“总分100”。","advice":"网站保留逐行分值并提示原表算术不一致，不擅自改动任何子项得分。","refs":[35]},{"title":"颈部淋巴结触诊：双手同步与否","topic":"颈部淋巴结","first":"《助理全身体格检查》“头颈部淋巴结检查”段落先写“不可以双手两侧同时检查”。","second":"紧随其后的检查顺序段落又写“左手触病人右侧，右手触病人左侧……双手同时触摸”。","advice":"这是同一份笔记内部的表述冲突，不能据此确定唯一规范动作；训练前需以实际示教与当前考核要求核对。","refs":[11]}];

;toast('JSON备份已生成')}if(a==='export-md'){download('体格检查_学习笔记.md','text/markdown;charset=utf-8',exportMd());toast('Markdown笔记已生成')}if(a==='import-json')document.getElementById('import-input').click();return}if(t.dataset.modal){let a=t.dataset.modal;if(a==='close')closePage();if(a==='prev')showPage(Math.max(84,ui.sourcePage-1));if(a==='next')showPage(Math.min(92,ui.sourcePage+1));if(a==='zoom')document.getElementById('modal-scroll').classList.toggle('zoomed')}});

/* M1racle Study v2.0: review scheduler / 7-day study plan / mobile usability */
function todayKey(date=new Date()){return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`}
function dateAdd(iso,n){const y=+iso.slice(0,4),m=+iso.slice(5,7),d=+iso.slice(8,10);const t=new Date(y,m-1,d+n);return todayKey(t)}
function dayDiff(a,b){const [y1,m1,d1]=a.split('-').map(Number),[y2,m2,d2]=b.split('-').map(Number);return Math.floor((Date.UTC(y1,m1-1,d1)-Date.UTC(y2,m2-1,d2))/86400000)}
function logActivity(){let k=todayKey();saved.activity[k]=(saved.activity[k]||0)+1}
function streak(){let k=todayKey(),n=0;if(!saved.activity[k])k=dateAdd(k,-1);while(saved.activity[k]&&n<365){n++;k=dateAdd(k,-1)}return n}
function dueItems(){return DATA.items.filter(x=>saved.reviews[x.id]&&saved.reviews[x.id].due<=todayKey()).sort((a,b)=>saved.reviews[a.id].due.localeCompare(saved.reviews[b.id].due))}
function reviewCounts(){let all=DATA.items.filter(x=>saved.reviews[x.id]);return {due:dueItems().length,scheduled:all.length,done:all.filter(x=>saved.reviews[x.id].count>0).length}}
function selectReview(id){ui.reviewId=id;ui.revealed=false;render()}
function gradeReview(id,grade){const old=saved.reviews[id]||{step:0,count:0};let step=old.step||0;let wait;if(grade==='again'){step=0;wait=1}else if(grade==='hard'){step=Math.max(0,step);wait=1}else{step=Math.min(step+1,5);wait=[1,3,7,14,30,60][step]}
  saved.reviews[id]={step,due:dateAdd(todayKey(),wait),last:todayKey(),count:(old.count||0)+1,grade};if(grade==='good'&&mastery(id)<2)saved.mastery[id]=2;
  saved.lastStudy=id;logActivity();save();let next=dueItems().find(x=>x.id!==id);ui.reviewId=next?next.id:null;ui.revealed=false;render();toast(`已安排 ${wait} 天后再复习`)
}
function createReview(id){if(!saved.reviews[id])saved.reviews[id]={step:0,due:todayKey(),last:null,count:0};save();ui.reviewId=id;ui.revealed=false;go('review')}
function renderReview(){let count=reviewCounts(),due=dueItems(),x=item(ui.reviewId)||due[0]||null;if(!x||!saved.reviews[x.id]||saved.reviews[x.id].due>todayKey())x=due[0]||null;let planned=DATA.items.filter(i=>saved.reviews[i.id]&&saved.reviews[i.id].due>todayKey()).sort((a,b)=>saved.reviews[a.id].due.localeCompare(saved.reviews[b.id].due));
  let intro=hdr('今日复习','按简化间隔重复法自动安排下一次复习。复习结果只影响学习计划，不代表临床操作能力的客观评价。',`<button class="btn secondary" data-go="study">添加更多考点</button>`);
  let stats=`<div class="review-summary">${metric(count.due,'今日到期')}${metric(count.scheduled,'已纳入复习')}${metric(streak()+'天','连续学习')}</div>`;
  let body=x?`<div class="review-prompt"><div class="kicker">TODAY'S CARD / #${String(x.id).padStart(2,'0')}</div><div class="big">${esc(x.title)}</div><div class="small muted">${esc(cat(x.cat).name)}　·　${esc(origin(x))}</div><p class="small muted">先尝试说出检查部位、操作步骤和报告要点，再查看答案。</p></div>${ui.revealed?`<div class="reveal-box"><b>教材提炼</b><p>${esc(x.core)}</p><b>操作与观察顺序</b><p>${esc(x.steps)}</p>${x.check?`<b>注意</b><p>${esc(x.check)}</p>`:''}<div>${pageBtn(x.pageStart,'查看原书页码 P'+x.pageStart)}</div></div><div class="review-actions"><button class="btn ghost" data-grade="again" data-id="${x.id}">不会，明天再练</button><button class="btn secondary" data-grade="hard" data-id="${x.id}">模糊，明天再练</button><button class="btn" data-grade="good" data-id="${x.id}">记住了，延后复习</button></div>`:`<button class="btn" data-reveal="1" style="width:100%;min-height:49px">显示答案与检查步骤 ↓</button>`}`:
  `<div class="panel-lite" style="text-align:center;padding:43px 20px"><div style="font-size:28px">✓</div><h2>${count.scheduled?'今日待复习已清空':'从第一个考点开始'}</h2><p class="small muted">${count.scheduled?'下次到期时会出现在这里。':'先在分区导学里学完一个考点并标记掌握，或点击下面的快捷加入。'}</p><button class="btn" data-openitem="${saved.lastStudy||1}">${count.scheduled?'继续学其他考点':'开始学习第1项'}</button></div>`;
  let quick=DATA.items.filter(i=>!saved.reviews[i.id]).slice(0,5);
  return intro+stats+`<section class="section review-panel"><div class="panel"><div class="toolbar"><div><div class="kicker">SMART REVIEW</div><h2 style="margin:6px 0">${x?'先回忆，再核对':'复习队列'}</h2></div><span class="group-tag">${due.length} 项待练</span></div>${body}</div><aside class="panel"><div class="kicker">UPCOMING / 接下来</div><h2 style="margin:7px 0 12px">复习日程</h2>${planned.length?planned.slice(0,7).map(z=>`<div class="help-row"><span class="help-icon">${z.id}</span><div><b>${esc(z.title)}</b><div class="small muted">${saved.reviews[z.id].due} 到期</div></div></div>`).join(''):'<p class="small muted">目前没有未来到期的任务。</p>'}<div class="health-note">复习间隔使用本网页的简化规则：明天、3天、7天、14天、30天等；不是教材要求的复习周期。</div></aside></section><section class="section panel"><h2>快速加入复习队列</h2><p class="small muted">可以先从尚未安排复习的项目中选择；加入后今天即可开始练习。</p><div class="grid2">${quick.map(y=>`<button class="map-node" data-add-review="${y.id}"><span><b>#${y.id} ${esc(y.title)}</b><br/><span>${esc(origin(y))}</span></span><span>加入</span></button>`).join('')||'<div class="empty">66个考点均已纳入间隔复习。</div>'}</div></section>`;
}

 {name:'脊柱四肢与神经',range:'52–66',first:52,last:66,focus:'脊柱、四肢、浅深反射与病理征'}

function planProgress(n){let p=PLAN_DAYS[n],a=DATA.items.filter(x=>x.id>=p.first&&x.id<=p.last);return {done:countDone(a),total:a.length}}
function renderPlan(){let started=!!saved.planStart,now=started?Math.min(7,Math.max(1,dayDiff(todayKey(),saved.planStart)+1)):1,d=Math.min(7,Math.max(1,Number(saved.planDay)||now));if(!started)d=Number(saved.planDay)||1;let unit=PLAN_DAYS[d-1],progress=planProgress(d-1),allDone=PLAN_DAYS.reduce((n,p,i)=>n+planProgress(i).done,0);return hdr('7天学习计划','按照教材编号设计的7天轮训路线，可随时查看任意一天；不是教材规定的考试日程。')+`<div class="panel"><div class="toolbar"><div><div class="kicker">7-DAY SPRINT</div><h2 style="margin:6px 0">${started?`第 ${now} 天，从 ${saved.planStart} 开始`:'建立你的复习节奏'}</h2><p class="small muted">当前已掌握 ${allDone}/66 项，今日学习后可立即安排间隔复习。</p></div><div>${started?`<button class="btn secondary" data-plan-reset="1">重新开始计划</button>`:`<button class="btn" data-plan-start="1">从今天开始</button>`}</div></div><div class="bar" style="height:9px;margin-top:19px"><i style="width:${pct(allDone,66)}%"></i></div><div class="plan-days">${PLAN_DAYS.map((p,i)=>`<button class="plan-day ${d===i+1?'active':''} ${planProgress(i).done===planProgress(i).total?'ended':''}" data-plan-day="${i+1}" aria-label="查看第${i+1}天"><strong>${i+1}</strong><small>第${i+1}天<br/>${p.range}</small></button>`).join('')}</div></div><section class="section grid2"><div class="panel"><div class="kicker">DAY ${String(d).padStart(2,'0')}</div><h2 style="margin:8px 0">${esc(unit.name)}</h2><p class="small muted">${esc(unit.focus)}，考点 ${unit.range}</p><div class="toolbar" style="margin:16px 0"><b>${progress.done}/${progress.total} 项已掌握</b><button class="btn sm soft" data-start-day="${d}">开始本日考点</button></div>${DATA.items.filter(x=>x.id>=unit.first&&x.id<=unit.last).map(x=>`<div class="plan-item"><span><strong>#${x.id} ${esc(x.title)}</strong><small>${esc(origin(x))}</small></span><button class="btn sm ${mastery(x.id)===2?'soft':'secondary'}" data-openitem="${x.id}">${mastery(x.id)===2?'✓ 已掌握':'去学习'}</button></div>`).join('')}</div><aside><div class="panel"><div class="kicker">DAILY ROUTINE</div><h2 style="margin:8px 0">每天做这三件事</h2>${[['01','先看步骤','对照教材来源页码，理解定位和手法。'],['02','再动手练','复述体位、顺序与结果报告。'],['03','最后做题','错题重练，把已掌握项目加入复习队列。']].map(x=>`<div class="help-row"><span class="help-icon">${x[0]}</span><div><b>${x[1]}</b><div class="small muted">${x[2]}</div></div></div>`).join('')}<div class="toolbar" style="margin-top:18px"><button class="btn soft" data-go="quiz">开始自测</button><button class="btn secondary" data-go="review">今日复习</button></div></div><div class="health-note" style="margin-top:14px">7天计划以学习组织为目的，并非考试官方安排。重要操作请结合线下示教和当年考核要求。</div></aside></section>`}
const previousOverview=renderOverview;
renderOverview=function(){let old=previousOverview();let progress=pct(countDone(),66),q=reviewCounts(),todayPlan=saved.planStart?Math.min(7,Math.max(1,dayDiff(todayKey(),saved.planStart)+1)):null;let panels=`<div class="studio-strip"><button class="studio-status" data-go="review"><span class="ring"><strong>${q.due}</strong></span><span><h3>今日到期复习</h3><p>${q.scheduled?`${q.scheduled} 项已进入间隔复习`:'学习后标记“掌握”即可自动安排'}</p></span></button><button class="studio-status" data-go="plan"><span class="ring"><strong>${progress}%</strong></span><span><h3>${todayPlan?'第'+todayPlan+'天计划':'制定7天计划'}</h3><p>${countDone()}/66项已掌握，连续学习${streak()}天</p></span></button></div>`;
let pos=old.indexOf('</section><section class="metrics">');if(pos!==-1)old=old.slice(0,pos+10)+panels+old.slice(pos+10);
return old.replace('SOURCE-TRACEABLE STUDY LAB / 2025','M1RACLE STUDY / INTERACTIVE MEDICAL LEARNING').replace('查看考前注意事项','查看考前注意事项');
};
// Safe page links: a numbered page is a reference, not an image of the textbook.
const origPageBtn=pageBtn;pageBtn=function(n,label){return `<button class="source-btn" data-page="${n}" title="教材P${n}（PDF第${n+7}页），公开版不附扫描图">${label||'书内 P'+n}</button>`};
// Prefer restoring original focus once source modal closes.
const origShowPage=showPage;showPage=function(p){if(!document.getElementById('source-modal').classList.contains('open'))ui.sourceFocus=document.activeElement;origShowPage(p)};
const origClosePage=closePage;closePage=function(){let was=document.getElementById('source-modal').classList.contains('open');origClosePage();if(was&&ui.sourceFocus?.focus)ui.sourceFocus.focus();};
// Extra actions attach alongside the legacy delegated handlers.
document.addEventListener('click',event=>{
  const el=event.target.closest('[data-toggle-more],[data-close-more],[data-add-review],[data-reveal],[data-grade],[data-plan-day],[data-plan-start],[data-plan-reset],[data-start-day]');if(!el)return;
  if(el.hasAttribute('data-toggle-more')){ui.moreOpen=!ui.moreOpen;renderNav();return}
  if(el.hasAttribute('data-close-more')){ui.moreOpen=false;renderNav();return}
  if(el.hasAttribute('data-add-review')){createReview(+el.dataset.addReview);return}
  if(el.hasAttribute('data-reveal')){ui.revealed=true;render();return}
  if(el.hasAttribute('data-grade')){gradeReview(+el.dataset.id,el.dataset.grade);return}
  if(el.hasAttribute('data-plan-day')){saved.planDay=+el.dataset.planDay;save();render();return}
  if(el.hasAttribute('data-plan-start')){saved.planStart=todayKey();saved.planDay=1;save();render();toast('7天计划从今天开始');return}
  if(el.hasAttribute('data-plan-reset')){if(confirm('重新开始7天计划？已掌握考点、笔记和错题不会被清除。')){saved.planStart=todayKey();saved.planDay=1;save();render()}return}
  if(el.hasAttribute('data-start-day')){ui.cat='all';ui.search='';ui.studyFilter='all';ui.view='study';ui.scrollTo=PLAN_DAYS[+el.dataset.startDay-1].first;document.getElementById('global-search').value='';history.replaceState(null,'','#/study');render();setTimeout(()=>document.getElementById('item-'+ui.scrollTo)?.scrollIntoView({block:'start',behavior:'smooth'}),70);return}
});
// Close the bottom sheet with Escape while keeping the source dialog shortcuts.
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.moreOpen){ui.moreOpen=false;renderNav()}});

// v5: weighted self-scoring persistence. No server calls or account sync.
document.addEventListener('click',e=>{const a=e.target.closest('[data-score-for]');if(a){ui.rubricId=RUBRIC_MAP[+a.dataset.scoreFor]||1}},true);
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-rubric],[data-rubric-clear]');if(!el)return;
  if(el.dataset.rubric){ui.rubricId=+el.dataset.rubric;render();window.scrollTo(0,0);return}
  if(el.dataset.rubricClear){const id=+el.dataset.rubricClear;if(confirm('清空当前评分表的自评分数？不会删除原有学习记录。')){saved.rubricScores[id]={};save();render()}return}
});
document.addEventListener('change',e=>{
  const field=e.target.closest('[data-score-row]');if(!field)return;
  const [rId,rowId]=field.dataset.scoreRow.split(':').map(Number);
  const rub=scoreRubric(rId),scoreRow=rub.rows.find(x=>x.id===rowId);if(!scoreRow)return;
  saved.rubricScores[rId]=saved.rubricScores[rId]||{};
  if(field.value===''){delete saved.rubricScores[rId][rowId]}
  else {const v=Number(field.value);if(!Number.isFinite(v))return;const clamped=Math.max(0,Math.min(scoreRow.max,Math.round(v)));saved.rubricScores[rId][rowId]=clamped;field.value=String(clamped)}
  save();document.getElementById('score-total').textContent=rubricRowsTotal(rub);
  document.getElementById('marked-count').textContent=Object.keys(saved.rubricScores[rId]).length;
});

// Preserve navigation after a refresh; existing saves use the same v1 localStorage key.
const fromHash=location.hash.replace('#/','');if(['overview','study','script','rubric','differences','review','plan','flow','numbers','quiz','notes','sources'].includes(fromHash))ui.view=fromHash;
window.addEventListener('hashchange',()=>{let v=location.hash.replace('#/','');if(['overview','study','script','rubric','differences','review','plan','flow','numbers','quiz','notes','sources'].includes(v)&&v!==ui.view){ui.view=v;ui.moreOpen=false;render()}});
// Self-contained static app; worker caches only own assets, never notes or test answers.
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',async()=>{
    try{
      const reg=await navigator.serviceWorker.register('service-worker.js');
      const banner=document.getElementById('update-banner');
      const apply=document.getElementById('apply-update');
      const showUpdate=worker=>{if(!worker)return;banner.classList.add('show');apply.onclick=()=>worker.postMessage({type:'SKIP_WAITING'})};
      if(reg.waiting)showUpdate(reg.waiting);
      reg.addEventListener('updatefound',()=>{
        const nw=reg.installing;if(!nw)return;
        nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)showUpdate(nw)})
      });
      navigator.serviceWorker.addEventListener('controllerchange',()=>window.location.reload());
    }catch(e){}
  });
}


// Action-rehearsal controls. Local-only; no uploads or microphone permission.
function speakPractice(id,part){if(!('speechSynthesis' in window)){toast('当前浏览器不支持朗读，请直接阅读台词');return}let txt='';let d=drillRecord(id);if(part==='intro')txt=drillIntro(id);else if(part==='result')txt=drillResult(id);else txt=d.steps[Number(part)]?.say||'';if(!txt)return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(txt);u.lang='zh-CN';u.rate=0.88;u.pitch=1;window.speechSynthesis.speak(u)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-script-id],[data-script-go],[data-script-hide],[data-drill-reset],[data-say]');if(!t)return;
if(t.dataset.scriptId){ui.scriptId=Number(t.dataset.scriptId);ui.view='script';ui.scriptSearch='';history.replaceState(null,'','#/script');render();document.querySelector('.script-main')?.scrollIntoView({behavior:'smooth',block:'start'});return}
if(t.dataset.scriptGo){ui.scriptId=Number(t.dataset.scriptGo);go('script');return}
if(t.dataset.scriptHide){ui.scriptHide=!ui.scriptHide;render();return}
if(t.dataset.drillReset){delete saved.drillChecks[Number(t.dataset.drillReset)];save();render();return}
if(t.dataset.say){speakPractice(Number(t.dataset.say),t.dataset.saystep);return}
});
document.addEventListener('change',e=>{const t=e.target;if(t.matches('[data-drill-check]')){const id=Number(t.dataset.drillCheck),step=Number(t.dataset.step);saved.drillChecks[id]=saved.drillChecks[id]||{};saved.drillChecks[id][step]=t.checked;save();if(ui.view==='script')render();else{const details=t.closest('details');const it=t.closest('.item');const idd=details?.id;render();if(idd){const reopen=document.getElementById(idd);if(reopen)reopen.open=true;}if(it)document.getElementById(it.id)?.scrollIntoView({block:'nearest'})}return}});
document.addEventListener('input',e=>{if(e.target.id==='script-search'){ui.scriptSearch=e.target.value;const focus=e.target.selectionStart;render();const input=document.getElementById('script-search');input?.focus();input?.setSelectionRange(focus,focus)}});


window.addEventListener('m1racle:remote-state',e=>{
 if(e.detail.scope!=='physical')return;
 saved=Object.assign(defaults(),e.detail.state||{});
 saved.reviews=saved.reviews||{};saved.activity=saved.activity||{};
 saved.drillChecks=saved.drillChecks||{};saved.rubricScores=saved.rubricScores||{};
 updateTheme();render();
});
updateTheme();render();
</script>
